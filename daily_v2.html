<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ 星尘日记 · STARDUST JOURNAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{--bg:#07071a;--surface:#0f0f28;--surface2:#171736;--border:#1e1e42;--text:#dde0f5;--text2:#8890b8;--text3:#454870;--accent:#00d4ff;--accent2:#a855f7;--accent3:#ff2d78;--accent4:#fbbf24;--accent5:#10f090;--red:#ff3d5a;--orange:#f97316;--radius:14px;--radius-sm:8px;--tr:0.3s cubic-bezier(.22,1,.36,1);--font:"Inter","PingFang SC","Microsoft YaHei",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#starCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ===LOGIN=== */
#loginOverlay{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 30% 40%,rgba(168,85,247,.12),transparent 60%),radial-gradient(ellipse at 70% 70%,rgba(0,212,255,.10),transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center}
.login-box{width:100%;max-width:420px;padding:2.5rem;background:rgba(15,15,40,.85);border:1px solid rgba(168,85,247,.25);border-radius:20px;backdrop-filter:blur(30px);box-shadow:0 0 80px rgba(168,85,247,.15),0 30px 60px rgba(0,0,0,.5);animation:loginIn .5s ease-out}
@keyframes loginIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
.login-logo{text-align:center;font-size:2rem;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.4rem}
.login-sub{text-align:center;font-size:.75rem;color:var(--text3);letter-spacing:3px;margin-bottom:2rem}
.login-field{margin-bottom:1.2rem}
.login-field label{display:block;font-size:.75rem;color:var(--text2);letter-spacing:2px;margin-bottom:.5rem;font-weight:500}
.login-input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;color:#fff;font-size:1rem;font-family:var(--font);outline:none;transition:border-color var(--tr),box-shadow var(--tr)}
.login-input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(168,85,247,.12)}
.login-btn{width:100%;padding:.9rem;border-radius:50px;border:none;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-size:1rem;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all var(--tr);margin-top:.5rem}
.login-btn:hover{box-shadow:0 8px 30px rgba(168,85,247,.4);transform:translateY(-2px)}
.login-err{color:var(--red);font-size:.8rem;text-align:center;margin-top:.8rem;min-height:1.2rem;letter-spacing:1px}
.login-hint{text-align:center;font-size:.7rem;color:var(--text3);margin-top:1.2rem;letter-spacing:1px;line-height:1.7}
.session-info{display:flex;align-items:center;gap:.5rem;margin-top:1rem;font-size:.75rem;color:var(--text2)}
.session-info input[type=checkbox]{accent-color:var(--accent2);width:14px;height:14px;cursor:pointer}

/* ===APP CHROME=== */
.motivation-bar{position:fixed;top:0;left:0;right:0;z-index:50;padding:.45rem 1.5rem;background:linear-gradient(135deg,rgba(0,212,255,.07),rgba(168,85,247,.07));border-bottom:1px solid var(--border);backdrop-filter:blur(15px);display:flex;justify-content:center;align-items:center;gap:2rem;flex-wrap:wrap}
.motivation-bar .cn{font-size:.85rem;font-weight:600;letter-spacing:1px;background:linear-gradient(135deg,var(--accent4),var(--accent3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.motivation-bar .en{font-size:.7rem;color:var(--text2);font-style:italic}
.app-container{position:relative;z-index:1;display:flex;min-height:100vh;padding-top:36px}
.sidebar{width:260px;min-width:260px;background:rgba(10,10,32,.88);backdrop-filter:blur(30px);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1rem .7rem;position:sticky;top:0;height:calc(100vh - 36px);z-index:10;transition:transform var(--tr);overflow-y:auto}
.sidebar-logo{font-size:1.2rem;font-weight:900;letter-spacing:3px;text-align:center;margin-bottom:.5rem;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
.sidebar-nav{list-style:none;display:flex;flex-direction:column;gap:.15rem}
.sidebar-nav li a{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;border-radius:var(--radius-sm);text-decoration:none;color:var(--text2);font-size:.82rem;letter-spacing:.5px;transition:all var(--tr);font-weight:500;cursor:pointer;position:relative}
.sidebar-nav li a:hover,.sidebar-nav li a.active{color:#fff;background:rgba(0,212,255,.07);box-shadow:inset 0 0 0 1px rgba(0,212,255,.18)}
.sidebar-nav li a.active::before{content:"";position:absolute;left:-.35rem;top:50%;transform:translateY(-50%);width:3px;height:14px;border-radius:3px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.nav-icon{font-size:1rem;width:20px;text-align:center}
.badge{display:inline-block;padding:.08rem .45rem;border-radius:20px;font-size:.6rem;font-weight:700;margin-left:auto;letter-spacing:1px}
.badge-n{background:rgba(0,212,255,.12);color:var(--accent)}
.badge-t{background:rgba(255,61,90,.15);color:var(--red)}
.badge-s{background:rgba(251,191,36,.15);color:var(--accent4)}
.badge-b{background:rgba(168,85,247,.15);color:var(--accent2)}
.sidebar-divider{border-top:1px solid var(--border);margin:.3rem 0;opacity:.5}
.sidebar-footer{text-align:center;font-size:.58rem;color:var(--text3);letter-spacing:2px;margin-top:.5rem;display:flex;align-items:center;justify-content:center;gap:.4rem;flex-wrap:wrap}
.logout-btn{background:rgba(255,61,90,.08);border:1px solid rgba(255,61,90,.25);color:var(--red);border-radius:6px;padding:.2rem .6rem;font-size:.65rem;cursor:pointer;transition:all var(--tr);letter-spacing:1px}
.logout-btn:hover{background:rgba(255,61,90,.18)}

/* ===CALENDAR=== */
.sidebar-calendar{margin-top:.5rem;border-top:1px solid var(--border);padding-top:.5rem}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem}
.cal-header span{font-size:.68rem;font-weight:700;letter-spacing:1px;color:#fff}
.cal-nav-btn{background:none;border:1px solid var(--border);color:var(--text2);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.75rem;transition:all var(--tr);display:flex;align-items:center;justify-content:center}
.cal-nav-btn:hover{border-color:var(--accent);color:#fff}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.58rem;color:var(--text3);margin-bottom:.15rem}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:.6rem;cursor:pointer;transition:all var(--tr);color:var(--text2);position:relative}
.cal-day:hover{background:rgba(0,212,255,.1);color:#fff}
.cal-day.today{border:1.5px solid var(--accent);color:#fff;font-weight:700}
.cal-day.has-entry::after{content:"";position:absolute;bottom:1px;width:3px;height:3px;border-radius:50%;background:var(--accent2)}
.cal-day.selected{background:var(--accent);color:#07071a;font-weight:700}
.cal-day.other-month{color:var(--text3);opacity:.35;cursor:default}

/* ===MAIN=== */
.main-area{flex:1;display:flex;flex-direction:column;padding:1.5rem 2rem;gap:1.2rem;max-width:1080px;margin:0 auto;width:100%}
.top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem}
.top-bar h2{font-size:1.4rem;font-weight:700;letter-spacing:1.5px;color:#fff}
.top-bar h2 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.top-actions{display:flex;gap:.5rem;flex-wrap:wrap}

/* ===BUTTONS=== */
.btn{padding:.55rem 1.2rem;border-radius:50px;font-size:.82rem;letter-spacing:1px;cursor:pointer;font-weight:600;border:none;transition:all var(--tr);font-family:var(--font);display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#07071a;box-shadow:0 4px 20px rgba(0,212,255,.25)}
.btn-primary:hover{box-shadow:0 6px 35px rgba(0,212,255,.45);transform:translateY(-2px)}
.btn-ghost{background:transparent;border:1.5px solid rgba(255,255,255,.15);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);box-shadow:0 0 20px rgba(0,212,255,.18);color:#fff}
.btn-sm{padding:.38rem .9rem;font-size:.75rem}
.btn-danger{background:transparent;border:1.5px solid rgba(255,61,90,.35);color:var(--red)}
.btn-danger:hover{background:rgba(255,61,90,.1);border-color:var(--red)}
.btn-danger-solid{background:rgba(255,61,90,.8);border:none;color:#fff}
.btn-danger-solid:hover{background:var(--red)}
.btn-success{background:transparent;border:1.5px solid rgba(16,240,144,.35);color:var(--accent5)}
.btn-success:hover{background:rgba(16,240,144,.1)}
.btn-star{background:rgba(251,191,36,.12);border:1.5px solid rgba(251,191,36,.35);color:var(--accent4)}
.btn-star.active-star{background:var(--accent4);color:#07071a}
.btn-blog{background:rgba(168,85,247,.12);border:1.5px solid rgba(168,85,247,.35);color:var(--accent2)}

/* ===TYPE TABS=== */
.type-tabs{display:flex;gap:.4rem;background:rgba(0,0,0,.3);border-radius:50px;padding:.3rem;border:1px solid var(--border)}
.type-tab{padding:.4rem 1rem;border-radius:50px;font-size:.78rem;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all var(--tr);letter-spacing:.5px;font-family:var(--font)}
.type-tab.active{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 2px 15px rgba(168,85,247,.3)}

/* ===EDITOR=== */
.editor-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.4rem;box-shadow:0 0 40px rgba(0,212,255,.05);display:flex;flex-direction:column;gap:.9rem;animation:fadeUp .35s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.editor-meta{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.editor-date{font-size:.85rem;color:var(--accent);font-weight:600;letter-spacing:2px;display:flex;align-items:center;gap:.35rem}
.editor-title-input{flex:1;min-width:200px;background:transparent;border:none;border-bottom:2px solid var(--border);color:#fff;font-size:1.3rem;font-weight:700;padding:.35rem 0;letter-spacing:.5px;font-family:var(--font);transition:border-color var(--tr);outline:none}
.editor-title-input:focus{border-bottom-color:var(--accent)}
.mood-selector{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.mood-selector>span{font-size:.75rem;color:var(--text3);letter-spacing:1.5px}
.mood-btn{font-size:1.4rem;padding:.35rem .6rem;border-radius:50px;background:rgba(255,255,255,.03);border:1.5px solid transparent;cursor:pointer;transition:all var(--tr);filter:grayscale(.45)}
.mood-btn:hover{filter:grayscale(0);transform:scale(1.15)}
.mood-btn.selected{filter:grayscale(0);border-color:var(--accent);background:rgba(0,212,255,.1);box-shadow:0 0 16px rgba(0,212,255,.25);transform:scale(1.1)}
.format-toolbar{display:flex;gap:.25rem;flex-wrap:wrap;padding:.5rem 0;border-bottom:1px solid var(--border)}
.fmt-btn{width:32px;height:32px;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--text2);cursor:pointer;font-size:.8rem;transition:all var(--tr);display:flex;align-items:center;justify-content:center;font-family:var(--font);font-weight:600}
.fmt-btn:hover{background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.28);color:#fff}
.fmt-sep{width:1px;background:var(--border);margin:0 .3rem;align-self:stretch}
.editor-content{min-height:260px;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1.1rem;color:var(--text);font-size:.98rem;line-height:1.85;outline:none;overflow-y:auto;font-family:var(--font);transition:border-color var(--tr)}
.editor-content:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,255,.04)}
.editor-content:empty::before{content:"在这里写下你的想法... ✦";color:var(--text3);pointer-events:none}
.editor-content h1,.editor-content h2,.editor-content h3{color:#fff;margin:1rem 0 .5rem}
.editor-content h1{font-size:1.5rem;border-bottom:2px solid var(--border);padding-bottom:.3rem}
.editor-content h2{font-size:1.2rem}
.editor-content h3{font-size:1.05rem;color:var(--accent2)}
.editor-content ul,.editor-content ol{padding-left:1.5rem;margin:.5rem 0}
.editor-content code{background:rgba(168,85,247,.15);padding:.12rem .45rem;border-radius:4px;font-family:"JetBrains Mono","Fira Code",monospace;font-size:.88em;color:var(--accent2)}
.editor-content pre{background:rgba(0,0,0,.45);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1rem;overflow-x:auto;margin:.8rem 0}
.editor-content pre code{background:none;padding:0;color:var(--accent4)}
.editor-content blockquote{border-left:3px solid var(--accent);padding-left:1rem;margin:.8rem 0;color:var(--text2);font-style:italic}
.editor-content a{color:var(--accent)}
.editor-content hr{border:none;border-top:1px solid var(--border);margin:1.5rem 0}

/* ===BLOG EDITOR (Markdown)=== */
.blog-md-area{min-height:260px;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.blog-md-editor{width:100%;min-height:260px;background:transparent;color:var(--text);font-size:.95rem;font-family:"JetBrains Mono","Fira Code",monospace;line-height:1.8;padding:1.1rem;border:none;outline:none;resize:vertical}
.blog-md-preview{padding:1.1rem;min-height:260px;color:var(--text);line-height:1.85}
.blog-md-preview h1,.blog-md-preview h2,.blog-md-preview h3,.blog-md-preview h4{color:#fff;margin:1.2rem 0 .5rem}
.blog-md-preview h1{font-size:1.6rem;border-bottom:2px solid var(--border);padding-bottom:.4rem}
.blog-md-preview h2{font-size:1.3rem}
.blog-md-preview h3{font-size:1.1rem;color:var(--accent2)}
.blog-md-preview code{background:rgba(168,85,247,.15);padding:.12rem .45rem;border-radius:4px;font-family:monospace;color:var(--accent2)}
.blog-md-preview pre{background:#1a1a2e;border:1px solid var(--border);border-radius:8px;padding:1rem;overflow-x:auto;margin:.8rem 0}
.blog-md-preview pre code{background:none;padding:0;color:inherit}
.blog-md-preview blockquote{border-left:3px solid var(--accent2);padding-left:1rem;margin:.8rem 0;color:var(--text2);font-style:italic}
.blog-md-preview ul,.blog-md-preview ol{padding-left:1.5rem;margin:.5rem 0}
.blog-md-preview a{color:var(--accent)}
.blog-md-preview img{max-width:100%;border-radius:8px}
.blog-md-preview table{width:100%;border-collapse:collapse;margin:.8rem 0}
.blog-md-preview th,.blog-md-preview td{border:1px solid var(--border);padding:.5rem .8rem;text-align:left}
.blog-md-preview th{background:rgba(0,212,255,.08);color:#fff;font-weight:600}
.blog-md-preview hr{border:none;border-top:1px solid var(--border);margin:1.5rem 0}
.md-tab-bar{display:flex;gap:.3rem;padding:.4rem;background:rgba(0,0,0,.25);border-bottom:1px solid var(--border)}
.md-tab{padding:.3rem .8rem;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all var(--tr);font-family:var(--font);letter-spacing:.5px}
.md-tab.active{background:rgba(168,85,247,.2);color:var(--accent2)}

/* ===TAGS=== */
.tag-input-area{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.tag-input-area label{font-size:.75rem;color:var(--text3);letter-spacing:1.5px;white-space:nowrap}
.tag-list{display:flex;gap:.35rem;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:.25rem;padding:.25rem .65rem;border-radius:20px;background:rgba(168,85,247,.1);color:var(--accent2);font-size:.72rem;letter-spacing:.5px;font-weight:500;border:1px solid rgba(168,85,247,.22);cursor:default}
.tag .tag-remove{cursor:pointer;opacity:.55;transition:opacity var(--tr)}
.tag .tag-remove:hover{opacity:1;color:var(--red)}
.tag-add-input{background:transparent;border:1px dashed var(--border);color:var(--text2);padding:.25rem .65rem;border-radius:20px;font-size:.72rem;width:90px;outline:none;font-family:var(--font);transition:border-color var(--tr)}
.tag-add-input:focus{border-color:var(--accent2);color:#fff}
/* Tag cloud */
.tag-cloud{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.tag-cloud .tag-item{cursor:pointer;padding:.25rem .7rem;border-radius:20px;font-size:.75rem;font-weight:500;letter-spacing:.5px;background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.15);color:var(--text2);transition:all var(--tr)}
.tag-cloud .tag-item:hover,.tag-cloud .tag-item.active{background:rgba(168,85,247,.2);border-color:var(--accent2);color:var(--accent2)}
.editor-actions{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:flex-end}

/* ===ENTRY CARDS=== */
.entries-list{display:flex;flex-direction:column;gap:.7rem}
.timeline-group{margin-bottom:.3rem}
.timeline-label{font-size:.72rem;color:var(--text3);letter-spacing:2px;padding:.3rem 0 .3rem 1rem;border-left:2px solid var(--accent);margin:.5rem 0 .3rem;font-weight:600}
.entry-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.4rem;cursor:pointer;transition:all var(--tr);position:relative;overflow:hidden;animation:fadeUp .3s ease-out}
.entry-card:hover{border-color:rgba(0,212,255,.35);box-shadow:0 8px 30px rgba(0,0,0,.35),0 0 0 1px rgba(0,212,255,.12);transform:translateX(4px)}
.entry-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:3px;opacity:0;transition:opacity var(--tr)}
.entry-card:hover::before{opacity:1}
.entry-card.blog-card::before{background:linear-gradient(180deg,var(--accent2),var(--accent3))}
.entry-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem;flex-wrap:wrap}
.entry-card-title{font-size:1.05rem;font-weight:700;color:#fff;letter-spacing:.5px}
.entry-card-type{font-size:.6rem;padding:.15rem .5rem;border-radius:20px;letter-spacing:1px;font-weight:700}
.entry-card-type.diary-badge{background:rgba(0,212,255,.12);color:var(--accent)}
.entry-card-type.blog-badge{background:rgba(168,85,247,.15);color:var(--accent2)}
.entry-card-date{font-size:.73rem;color:var(--accent);letter-spacing:1.5px;white-space:nowrap}
.entry-card-preview{color:var(--text2);font-size:.82rem;margin-top:.45rem;line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.entry-card-meta{display:flex;gap:.7rem;margin-top:.7rem;flex-wrap:wrap;align-items:center}
.entry-card-mood{font-size:1.2rem}
.entry-card-tags{display:flex;gap:.25rem;flex-wrap:wrap}
.entry-card-actions{display:flex;gap:.35rem;margin-top:.5rem;opacity:0;transition:opacity var(--tr)}
.entry-card:hover .entry-card-actions{opacity:1}
.star-toggle{font-size:1.2rem;cursor:pointer;transition:all var(--tr);background:none;border:none;color:var(--text3)}
.star-toggle:hover{transform:scale(1.3)}
.star-toggle.starred{color:var(--accent4);filter:drop-shadow(0 0 6px var(--accent4))}
.reading-time{font-size:.65rem;color:var(--text3);letter-spacing:1px;display:flex;align-items:center;gap:.2rem}

/* ===SEARCH=== */
.no-entries{text-align:center;padding:4rem 2rem;color:var(--text3);letter-spacing:2px}
.no-entries .icon{font-size:3.5rem;display:block;margin-bottom:1rem;animation:floatIcon 3s ease-in-out infinite}
@keyframes floatIcon{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.search-bar{display:flex;gap:.5rem;align-items:center}
.search-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:50px;padding:.6rem 1.2rem;color:#fff;font-size:.88rem;outline:none;font-family:var(--font);transition:all var(--tr);min-width:180px}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 20px rgba(0,212,255,.12)}
.search-input::placeholder{color:var(--text3)}

/* ===STATS=== */
.stats-bar{display:flex;gap:1.5rem;flex-wrap:wrap;margin:.2rem 0;padding:.8rem 1.2rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.stat-item{display:flex;flex-direction:column;align-items:center;gap:.1rem}
.stat-num{font-size:1.4rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:.6rem;color:var(--text3);letter-spacing:1.5px}
.stat-icon{font-size:.85rem;margin-bottom:.1rem}
.auto-save-indicator{font-size:.68rem;color:var(--accent5);letter-spacing:1px;display:flex;align-items:center;gap:.3rem;opacity:0;transition:opacity .3s}
.auto-save-indicator.show{opacity:1}
.word-count{font-size:.72rem;color:var(--text3);letter-spacing:.5px}

/* ===TOAST & MODAL=== */
.toast-container{position:fixed;top:1.2rem;right:1.2rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem}
.toast{padding:.7rem 1.3rem;border-radius:50px;font-size:.82rem;font-weight:600;letter-spacing:.5px;animation:toastIn .35s ease-out,toastOut .35s 2.3s ease-out forwards;backdrop-filter:blur(15px);border:1px solid}
.toast-success{background:rgba(16,240,144,.12);border-color:rgba(16,240,144,.35);color:var(--accent5)}
.toast-info{background:rgba(0,212,255,.12);border-color:rgba(0,212,255,.35);color:var(--accent)}
.toast-warn{background:rgba(249,115,22,.12);border-color:rgba(249,115,22,.35);color:var(--orange)}
@keyframes toastIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-20px)}}
.modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;max-width:420px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-icon{font-size:3rem;margin-bottom:.8rem}
.modal-title{font-size:1.1rem;font-weight:700;color:#fff;letter-spacing:1.5px;margin-bottom:.5rem}
.modal-desc{font-size:.82rem;color:var(--text2);margin-bottom:1.4rem;line-height:1.7}
.modal-actions{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.deleted-banner{background:rgba(255,61,90,.08);border:1px solid rgba(255,61,90,.25);border-radius:var(--radius-sm);padding:.6rem 1rem;color:var(--red);font-size:.82rem;text-align:center;letter-spacing:1px}

/* ===RESPONSIVE=== */
@media(max-width:900px){.sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);z-index:100;transition:transform var(--tr);height:100vh}.sidebar.open{transform:translateX(0);box-shadow:0 0 80px rgba(0,0,0,.7)}.main-area{padding:1rem}.mobile-menu-btn{display:flex!important}.editor-title-input{font-size:1.1rem}}
@media(min-width:901px){.mobile-menu-btn{display:none!important}}
.mobile-menu-btn{position:fixed;top:.7rem;left:.7rem;z-index:101;width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:#fff;font-size:1.2rem;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}
.overlay.show{display:block}
</style>

<script>
(function(){
"use strict";

// ===== STAR CANVAS =====
const sc=document.getElementById("starCanvas"),sctx=sc.getContext("2d");
let stars=[];
function resizeSC(){sc.width=innerWidth;sc.height=innerHeight;}
function initStars(){stars=[];for(let i=0;i<180;i++)stars.push({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*1.5+0.3,ts:Math.random()*0.018+0.004,to:Math.random()*Math.PI*2,hue:[200,270,340,40][Math.floor(Math.random()*4)]});}
function drawStars(t){sctx.clearRect(0,0,sc.width,sc.height);stars.forEach(s=>{const a=0.3+Math.sin(t*s.ts+s.to)*0.32;sctx.beginPath();sctx.arc(s.x,s.y,s.r,0,Math.PI*2);sctx.fillStyle=`hsla(${s.hue},80%,75%,${a})`;sctx.fill();if(s.r>1.0&&a>0.5){sctx.beginPath();sctx.arc(s.x,s.y,s.r*2.2,0,Math.PI*2);sctx.fillStyle=`hsla(${s.hue},80%,75%,${a*0.1})`;sctx.fill();}});requestAnimationFrame(drawStars);}
resizeSC();initStars();requestAnimationFrame(drawStars);
window.addEventListener("resize",()=>{resizeSC();initStars();});

// ===== CONFIGURE MARKED =====
try{marked.use({breaks:true,gfm:true});}catch(e){marked.setOptions({breaks:true,gfm:true});}
function renderMarkdown(md){let html=marked.parse(md||"");try{const temp=document.createElement("div");temp.innerHTML=html;temp.querySelectorAll("pre code").forEach(block=>{try{const lang=block.className.replace("language-","")||"";if(lang&&hljs.getLanguage(lang)){const result=hljs.highlight(block.textContent,{language:lang});block.innerHTML=result.value;block.className+=" hljs";}else{hljs.highlightElement(block);}}catch(e){}});html=temp.innerHTML;}catch(e){}return html;}

// ===== CONSTANTS =====
const SALT_KEY="sdj2_salt",AUTH_KEY="sdj2_auth",DATA_KEY="sdj2_data",SESSION_KEY="sdj2_sess",DRAFT_KEY="sdj2_draft";
const IV_LEN=12,TRASH_DAYS=30,PBKDF2_ITER=150000;
let aesKey=null,entries=[],currentView="editor",editingEntryId=null,selectedDate=null,editingType="diary";
let calMonth=new Date().getMonth(),calYear=new Date().getFullYear(),searchQuery="",searchTag="";
let autoSaveTimer=null,autoSaveDirty=false;

// ===== CRYPTO HELPERS =====
function ab2b64(b){return btoa(String.fromCharCode(...new Uint8Array(b)));}
function b642ab(s){const b=atob(s);return new Uint8Array(b.length).map((_,i)=>b.charCodeAt(i)).buffer;}

async function derivePBKDF2(password,saltBuf){
  const enc=new TextEncoder();
  const keyMat=await crypto.subtle.importKey("raw",enc.encode(password),{name:"PBKDF2"},false,["deriveBits","deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:saltBuf,iterations:PBKDF2_ITER,hash:"SHA-256"},keyMat,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
}

async function hashForAuth(password,saltB64){
  const saltBuf=b642ab(saltB64);
  const key=await derivePBKDF2(password,saltBuf);
  const raw=await crypto.subtle.exportKey("raw",key);
  const hashBuf=await crypto.subtle.digest("SHA-256",raw);
  return ab2b64(hashBuf);
}

async function enc(data){
  const iv=crypto.getRandomValues(new Uint8Array(IV_LEN));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},aesKey,new TextEncoder().encode(data));
  return {v:3,iv:ab2b64(iv),data:ab2b64(ct)};
}
async function dec(obj){
  const iv=b642ab(obj.iv),ct=b642ab(obj.data);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},aesKey,ct);
  return new TextDecoder().decode(pt);
}

// ===== AUTH SYSTEM =====
async function isFirstTime(){return !localStorage.getItem(AUTH_KEY);}

async function setupAccount(username,password){
  const salt=crypto.getRandomValues(new Uint8Array(32));
  const saltB64=ab2b64(salt.buffer);
  const hash=await hashForAuth(password,saltB64);
  const saltBuf=b642ab(saltB64);
  aesKey=await derivePBKDF2(password,saltBuf);
  localStorage.setItem(SALT_KEY,saltB64);
  localStorage.setItem(AUTH_KEY,JSON.stringify({username,hash,saltB64}));
  entries=[];
  await persistEntries();
}

async function verifyLogin(password){
  const auth=JSON.parse(localStorage.getItem(AUTH_KEY));
  if(!auth)return false;
  const hash=await hashForAuth(password,auth.saltB64);
  if(hash!==auth.hash)return false;
  const saltBuf=b642ab(auth.saltB64);
  aesKey=await derivePBKDF2(password,saltBuf);
  return true;
}

function saveSession(remember){
  const token=ab2b64(crypto.getRandomValues(new Uint8Array(32)).buffer);
  const expiry=Date.now()+(remember?30*86400000:3600000);
  sessionStorage.setItem(SESSION_KEY,JSON.stringify({token,expiry}));
  if(remember)localStorage.setItem(SESSION_KEY,JSON.stringify({token,expiry}));
  return token;
}

function checkSession(){
  let s=sessionStorage.getItem(SESSION_KEY);
  if(!s)s=localStorage.getItem(SESSION_KEY);
  if(!s)return false;
  try{const d=JSON.parse(s);return Date.now()<d.expiry;}catch(e){return false;}
}

function clearSession(){
  sessionStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(DRAFT_KEY);
}

// ===== DATA OPS =====
async function loadEntries(){
  const raw=localStorage.getItem(DATA_KEY);
  if(!raw){entries=[];return;}
  try{const obj=JSON.parse(raw);const p=await dec(obj);entries=JSON.parse(p);if(!Array.isArray(entries))entries=[];}
  catch(ex){entries=[];}
  sortEntries();
}
async function persistEntries(){
  const e=await enc(JSON.stringify(entries));
  localStorage.setItem(DATA_KEY,JSON.stringify(e));
}
function sortEntries(){entries.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));}
function getActive(){return entries.filter(e=>!e.deleted);}
function getTrash(){return entries.filter(e=>e.deleted);}
function getStarred(){return entries.filter(e=>e.starred&&!e.deleted);}
function getDiaries(){return entries.filter(e=>!e.deleted&&e.type!=="blog");}
function getBlogs(){return entries.filter(e=>!e.deleted&&e.type==="blog");}
function softDel(id){const e=entries.find(x=>x.id===id);if(e){e.deleted=true;e.deletedAt=new Date().toISOString();}}
function restore(id){const e=entries.find(x=>x.id===id);if(e){e.deleted=false;e.deletedAt=null;}}
function permDel(id){entries=entries.filter(e=>e.id!==id);}
function permDelAll(){entries=entries.filter(e=>!e.deleted);}
function toggleStar(id){const e=entries.find(x=>x.id===id);if(e)e.starred=!e.starred;}
function autoClean(){const now=new Date();entries=entries.filter(e=>{if(e.deleted&&e.deletedAt){if((now-new Date(e.deletedAt))/86400000>TRASH_DAYS)return false;}return true;});}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function formatDate(ds){if(!ds)return"";const p=ds.split("-");return `${p[0]}年${parseInt(p[1])}月${parseInt(p[2])}日`;}
function nowISO(){return new Date().toISOString();}

// ===== DRAFT AUTO-SAVE =====
function saveDraft(){const titleEl=document.getElementById("editorTitle");const contentEl=document.getElementById("editorContent")||document.getElementById("blogMdEditor");if(!contentEl)return;const title=titleEl?.value||"";const content=contentEl.value!==undefined?contentEl.value:contentEl.innerHTML||"";if(!title.trim()&&!content.replace(/<[^>]*>/g,"").trim()){clearDraft();return;}const mood=document.querySelector(".mood-btn.selected")?.dataset.mood||"";const tags=getCurrentTags();const draft={title,content,type:editingType,mood,tags,date:selectedDate||todayStr(),entryId:editingEntryId||null};localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));autoSaveDirty=true;updateAutoSaveIndicator();}
function clearDraft(){localStorage.removeItem(DRAFT_KEY);autoSaveDirty=false;updateAutoSaveIndicator();}
function loadDraft(){const raw=localStorage.getItem(DRAFT_KEY);if(!raw)return null;try{return JSON.parse(raw);}catch(e){return null;}}
function updateAutoSaveIndicator(){const el=document.getElementById("autoSaveIndicator");if(el){if(autoSaveDirty){el.classList.add("show");setTimeout(()=>{el.classList.remove("show");autoSaveDirty=false;},2000);}}}

// ===== UI UTILITIES =====
function toast(msg,ty="info"){const c=document.getElementById("toastContainer");const t=document.createElement("div");t.className=`toast toast-${ty}`;t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),2800);}
function confirmModal(title,desc,icon,confirmLabel,confirmClass,onConfirm){
  const ex=document.querySelector(".modal-overlay");if(ex)ex.remove();
  const ov=document.createElement("div");ov.className="modal-overlay";
  ov.innerHTML=`<div class="modal-box"><div class="modal-icon">${icon}</div><div class="modal-title">${title}</div><div class="modal-desc">${desc}</div><div class="modal-actions"><button class="btn btn-ghost btn-sm" id="modalCancelBtn">取消</button><button class="btn ${confirmClass} btn-sm" id="modalConfirmBtn">${confirmLabel}</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector("#modalCancelBtn").addEventListener("click",()=>ov.remove());
  ov.addEventListener("click",function(e){if(e.target===ov)ov.remove();});
  ov.querySelector("#modalConfirmBtn").addEventListener("click",()=>{ov.remove();if(onConfirm)onConfirm();});
}
function escapeHtml(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function stripHtml(h){const d=document.createElement("div");d.innerHTML=h;return d.textContent||"";}
function wordCount(html){const text=stripHtml(html);const cn=text.replace(/[a-zA-Z0-9\s]/g,"");const en=text.replace(/[^\sa-zA-Z0-9]/g,"").split(/\s+/).filter(Boolean);return cn.length+en.length;}
function readingTime(html){const words=wordCount(html);const minutes=Math.max(1,Math.ceil(words/300));return `${minutes} 分钟阅读`;}
function computeStreak(){
  const dates=[...new Set(getDiaries().map(e=>e.date))].sort().reverse();
  if(!dates.length)return 0;
  const now=todayStr();
  const mostRecent=dates[0];
  if(mostRecent!==now){
    const yd=new Date();yd.setDate(yd.getDate()-1);
    if(mostRecent!==yd.toISOString().slice(0,10))return 0;
  }
  let streak=1;
  for(let i=1;i<dates.length;i++){
    const a=new Date(dates[i-1]+"T00:00:00"),b=new Date(dates[i]+"T00:00:00");
    if(Math.round((a-b)/86400000)===1)streak++;else break;
  }
  return streak;
}
function computeStats(){
  const act=getActive();const diaries=getDiaries();const blogs=getBlogs();
  let totalWords=0;diaries.forEach(e=>{totalWords+=wordCount(e.content);});blogs.forEach(e=>{totalWords+=wordCount(e.content);});
  return{total:act.length,diaries:diaries.length,blogs:blogs.length,starred:getStarred().length,totalWords,streak:computeStreak()};
}

// ===== MOTIVATION =====
const quotes=[
  {cn:"每一天都是新的开始 ✦",en:"Every day is a fresh start."},
  {cn:"你比自己想象的更强大 💪",en:"You are stronger than you think."},
  {cn:"星光不负赶路人 🌟",en:"Starlight rewards the persistent."},
  {cn:"坚持是无声的力量 🕯️",en:"Persistence is silent strength."},
  {cn:"写下的每个字都是未来 📝",en:"Every word written shapes tomorrow."},
  {cn:"今天也是闪闪发光的一天 ✨",en:"Today is another shining day."},
  {cn:"梦想不会发光，发光的是追梦的你 🌙",en:"Dreams don't glow, you do."},
  {cn:"慢慢来，比较快 🐢",en:"Slow is smooth, smooth is fast."},
  {cn:"内心有光，脚下有路 🚀",en:"Light within, path ahead."},
  {cn:"勿忘初心，方得始终 🏁",en:"Stay true, reach the end."},
  {cn:"每一个清晨都是重启的机会 ⏰",en:"Every morning is a reset."},
  {cn:"你值得所有的美好 🌈",en:"You deserve all the good."},
];
function updateMotivation(){
  const h=new Date().getHours();const idx=h%quotes.length;const q=quotes[idx];
  const cnEl=document.getElementById("motivationCN"),enEl=document.getElementById("motivationEN");
  if(cnEl)cnEl.textContent=q.cn;if(enEl)enEl.textContent=q.en;
}

// ===== SIDEBAR & MOBILE =====
const sidebar=document.getElementById("sidebar"),overlay=document.getElementById("overlay"),mainArea=document.getElementById("mainArea");
const mobileBtn=document.getElementById("mobileMenuBtn");
function closeSidebar(){sidebar.classList.remove("open");overlay.classList.remove("show");}
function openSidebar(){sidebar.classList.add("open");overlay.classList.add("show");}
mobileBtn.addEventListener("click",()=>sidebar.classList.contains("open")?closeSidebar():openSidebar());
overlay.addEventListener("click",closeSidebar);

document.querySelectorAll(".sidebar-nav a[data-view]").forEach(a=>{
  a.addEventListener("click",function(e){e.preventDefault();currentView=this.getAttribute("data-view");editingEntryId=null;selectedDate=null;searchQuery="";searchTag="";editingType="diary";updateActiveNav();renderView();closeSidebar();});
});

// ===== CALENDAR =====
function renderSidebarCalendar(activeDateStr){
  const c=document.getElementById("sidebarCalendarContainer");if(!c)return;
  const datesWithEntries=new Set(getActive().map(e=>e.date));
  const monthNames=["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
  const weekdays=["日","一","二","三","四","五","六"];
  const fd=new Date(calYear,calMonth,1).getDay(),dim=new Date(calYear,calMonth+1,0).getDate();
  const prevDim=new Date(calYear,calMonth,0).getDate();
  const today=todayStr(),activeDate=activeDateStr||today;
  let days="";
  for(let i=fd-1;i>=0;i--){const d=prevDim-i,m=calMonth===0?12:calMonth,y=calMonth===0?calYear-1:calYear;days+=`<div class="cal-day other-month" data-date="${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}">${d}</div>`;}
  for(let d=1;d<=dim;d++){const ds=`${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;let cls="cal-day";if(ds===today)cls+=" today";if(ds===activeDate)cls+=" selected";if(datesWithEntries.has(ds))cls+=" has-entry";days+=`<div class="${cls}" data-date="${ds}">${d}</div>`;}
  const rem=7-((fd+dim)%7);
  if(rem<7){for(let d=1;d<=rem;d++){const m=calMonth===11?1:calMonth+2,y=calMonth===11?calYear+1:calYear;days+=`<div class="cal-day other-month" data-date="${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}">${d}</div>`;}}
  c.innerHTML=`<div class="cal-header"><button class="cal-nav-btn" id="calPrev">◀</button><span>${monthNames[calMonth]} ${calYear}</span><button class="cal-nav-btn" id="calNext">▶</button></div><div class="cal-weekdays">${weekdays.map(w=>`<div>${w}</div>`).join("")}</div><div class="cal-days">${days}</div>`;
  c.querySelectorAll(".cal-day:not(.other-month)").forEach(el=>{el.addEventListener("click",function(){const ds=this.getAttribute("data-date");selectedDate=ds;editingEntryId=null;const existing=getActive().filter(e=>e.date===ds);if(existing.length===1)editingEntryId=existing[0].id;else if(existing.length>1)editingEntryId=existing[0].id;editingType="diary";currentView="editor";renderView();});});
  c.querySelectorAll(".cal-day.other-month").forEach(el=>{el.addEventListener("click",function(){const ds=this.getAttribute("data-date");const p=ds.split("-");calYear=parseInt(p[0]);calMonth=parseInt(p[1])-1;selectedDate=ds;editingEntryId=null;editingType="diary";currentView="editor";renderView();});});
  document.getElementById("calPrev").addEventListener("click",()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderSidebarCalendar(activeDateStr);});
  document.getElementById("calNext").addEventListener("click",()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderSidebarCalendar(activeDateStr);});
}

// ===== TAGS =====
function renderTags(tags,containerId="tagList"){const el=document.getElementById(containerId);if(el)el.innerHTML=tags.map((t,i)=>`<span class="tag">${escapeHtml(t)}<span class="tag-remove" data-index="${i}">×</span></span>`).join("");}
function renderTagsReadonly(tags,containerId="tagList"){const el=document.getElementById(containerId);if(el)el.innerHTML=tags.map(t=>`<span class="tag" style="opacity:0.5">${escapeHtml(t)}</span>`).join("");}
function bindTagEvents(tags,containerId="tagList",inputId="tagAddInput"){const el=document.getElementById(containerId),inp=document.getElementById(inputId);if(!el||!inp)return;el.querySelectorAll(".tag-remove").forEach(b=>b.addEventListener("click",function(){const i=parseInt(this.dataset.index);tags.splice(i,1);renderTags(tags,containerId);bindTagEvents(tags,containerId,inputId);}));inp.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===","){e.preventDefault();const v=this.value.trim().replace(/,/g,"");if(v&&!tags.includes(v)&&tags.length<10){tags.push(v);renderTags(tags,containerId);bindTagEvents(tags,containerId,inputId);}this.value="";}});}
function getCurrentTags(containerId="tagList"){const el=document.getElementById(containerId);if(!el)return[];return[...el.querySelectorAll(".tag")].map(t=>t.textContent.replace("×","").trim()).filter(Boolean);}

// ===== RENDER EDITOR =====
function renderEditor(){
  const entry=editingEntryId?entries.find(e=>e.id===editingEntryId):null;
  const isDeleted=entry?.deleted;const dateStr=entry?.date||(selectedDate||todayStr());
  const title=entry?.title||"",content=entry?.content||"",mood=entry?.mood||"",tags=entry?.tags||[];
  const type=entry?.type||editingType||"diary";
  const moods=["😄","😊","😐","😔","😢","😡","🤩","🥰","😴","💪"];
  mainArea.innerHTML=`
    <div class="top-bar"><h2>${editingEntryId?(isDeleted?"👁️ 已删除":"✏️ 编辑"):(type==="blog"?'📝 <span>新博客</span>':'✦ <span>新日记</span>')}</h2>
      <div class="top-actions">
        ${!editingEntryId?`<div class="type-tabs"><button class="type-tab${type==="diary"?" active":""}" data-type="diary">📖 日记</button><button class="type-tab${type==="blog"?" active":""}" data-type="blog">📝 博客</button></div>`:''}
        ${editingEntryId&&!isDeleted?`<button class="btn btn-star btn-sm" id="starToggleBtn">${entry.starred?"⭐ 已星标":"☆ 加星标"}</button><button class="btn btn-danger btn-sm" id="deleteEntryBtn">🗑 删除</button>`:''}
        ${editingEntryId&&isDeleted?`<button class="btn btn-success btn-sm" id="restoreEntryBtn">📥 恢复</button><button class="btn btn-danger-solid btn-sm" id="permDeleteEntryBtn">💀 彻底删除</button>`:''}
        <button class="btn btn-ghost btn-sm" id="cancelEditBtn">取消</button></div></div>
    ${isDeleted?`<div class="deleted-banner"><span>此内容已在回收站中</span></div>`:''}
    <div class="stats-bar">${renderStatsHTML()}</div>
    <div class="editor-panel">
      <div class="editor-meta"><span class="editor-date">${formatDate(dateStr)}</span>
        <input type="text" class="editor-title-input" id="editorTitle" placeholder="${type==="blog"?"博客标题...":"日记标题..."}" value="${escapeHtml(title)}" maxlength="120" ${isDeleted?"readonly style='opacity:0.5'":""}>
        ${!isDeleted?`<span class="word-count" id="wordCountDisplay"></span>`:""}
        <span class="auto-save-indicator" id="autoSaveIndicator">💾 已自动保存</span></div>
      ${type==="diary"?`<div class="mood-selector"><span>心情：</span>${moods.map(m=>`<button class="mood-btn${mood===m?" selected":""}" data-mood="${m}" ${isDeleted?"disabled":""}>${m}</button>`).join("")}</div>`:""}
      ${!isDeleted&&type==="diary"?`<div class="format-toolbar">
        <button class="fmt-btn" data-cmd="bold"><b>B</b></button><button class="fmt-btn" data-cmd="italic"><i>I</i></button><button class="fmt-btn" data-cmd="underline"><u>U</u></button><span class="fmt-sep"></span>
        <button class="fmt-btn" data-cmd="h1">H1</button><button class="fmt-btn" data-cmd="h2">H2</button><button class="fmt-btn" data-cmd="h3">H3</button><span class="fmt-sep"></span>
        <button class="fmt-btn" data-cmd="ul">•≡</button><button class="fmt-btn" data-cmd="ol">1≡</button><button class="fmt-btn" data-cmd="quote">❝</button><button class="fmt-btn" data-cmd="code">&lt;/&gt;</button>
        <button class="fmt-btn" data-cmd="pre">[ ]</button><button class="fmt-btn" data-cmd="hr">—</button><button class="fmt-btn" data-cmd="link">🔗</button></div>`:""}
      <div id="editorContentContainer">
        ${type==="blog"? "":`<div class="editor-content" id="editorContent" ${isDeleted?"":"contenteditable=\"true\""} style="${isDeleted?"opacity:0.6;":""}">${content}</div>`}
      </div>
      ${!isDeleted?`<div class="tag-input-area"><label>标签：</label><div class="tag-list" id="tagList"></div><input type="text" class="tag-add-input" id="tagAddInput" placeholder="+ 添加" maxlength="20"></div>`:`<div class="tag-input-area"><label>标签：</label><div class="tag-list" id="tagList"></div></div>`}
      <div class="editor-actions">
        ${!isDeleted?`<button class="btn btn-primary" id="saveEntryBtn">💾 保存 (Ctrl+S)</button>`:""}
        ${isDeleted?`<button class="btn btn-success" id="restoreSaveBtn">📥 恢复</button><button class="btn btn-danger-solid" id="permDeleteSaveBtn">💀 彻底删除</button>`:""}
      </div></div>`;
  if(type==="blog"){renderBlogEditor(entry,isDeleted);}
  bindEditorEvents(entry,isDeleted,tags,type);
  if(!isDeleted){const draft=loadDraft();if(draft&&!editingEntryId&&!content){if(draft.type==="diary"){document.getElementById("editorContent").innerHTML=draft.content;}else{const mdEl=document.getElementById("blogMdEditor");if(mdEl)mdEl.value=draft.content;}document.getElementById("editorTitle").value=draft.title||"";if(draft.mood){const mb=document.querySelector(`.mood-btn[data-mood="${draft.mood}"]`);if(mb)mb.classList.add("selected");}}updateWordCount();}

function bindEditorEvents(entry,isDeleted,tags,type){
  if(isDeleted){
    if(type==="diary"){document.getElementById("editorContent").innerHTML=entry?.content||'<p style="color:var(--text3);">（已删除，无法编辑）</p>';renderTagsReadonly(tags);}
    document.querySelectorAll("[id^='restore']").forEach(b=>b.addEventListener("click",async()=>{restore(editingEntryId);await persistEntries();updateBadges();clearDraft();toast("已恢复","success");currentView="editor";renderView();}));
    document.querySelectorAll("[id^='permDelete']").forEach(b=>b.addEventListener("click",()=>{confirmModal("彻底删除","永久删除不可恢复","💀","确认","btn-danger-solid",async()=>{permDel(editingEntryId);await persistEntries();editingEntryId=null;updateBadges();toast("已彻底删除","info");currentView="trash";renderView();});}));
  }else{
    let crtTags=[...tags];renderTags(crtTags);bindTagEvents(crtTags);
    if(type==="diary"){
      document.querySelectorAll(".mood-btn").forEach(b=>b.addEventListener("click",function(){document.querySelectorAll(".mood-btn").forEach(x=>x.classList.remove("selected"));this.classList.add("selected");scheduleAutoSave();}));
      document.querySelectorAll(".fmt-btn").forEach(b=>b.addEventListener("click",function(){execFormat(this.getAttribute("data-cmd"));}));
      document.getElementById("editorContent").addEventListener("input",()=>{scheduleAutoSave();updateWordCount();});
    }
    document.getElementById("saveEntryBtn").addEventListener("click",saveCurrent);
    document.getElementById("editorTitle").addEventListener("input",()=>scheduleAutoSave());
    const starBtn=document.getElementById("starToggleBtn");
    if(starBtn)starBtn.addEventListener("click",async()=>{toggleStar(editingEntryId);await persistEntries();updateBadges();renderEditor();});
    const delBtn=document.getElementById("deleteEntryBtn");
    if(delBtn)delBtn.addEventListener("click",()=>{confirmModal("移入回收站","可在回收站恢复，30天后自动清理","🗑️","移入","btn-danger",async()=>{softDel(editingEntryId);await persistEntries();editingEntryId=null;updateBadges();clearDraft();toast("已移入回收站","info");currentView="list";renderView();});});
    document.querySelectorAll(".type-tab").forEach(tab=>{tab.addEventListener("click",function(){editingType=this.dataset.type;clearDraft();renderEditor();});});
  }
  document.getElementById("cancelEditBtn").addEventListener("click",()=>{editingEntryId=null;selectedDate=null;editingType="diary";clearDraft();currentView="list";renderView();});
}
function updateWordCount(){const type=editingType;let count=0;if(type==="blog"){const el=document.getElementById("blogMdEditor");if(el)count=wordCount(el.value);}else{const el=document.getElementById("editorContent");if(el)count=wordCount(el.innerHTML);}const disp=document.getElementById("wordCountDisplay");if(disp)disp.textContent=count+" 字";}
async function saveCurrent(){
  const entry=editingEntryId?entries.find(e=>e.id===editingEntryId):null;
  if(entry?.deleted){toast("已删除的内容无法编辑","warn");return;}
  const title=document.getElementById("editorTitle")?.value.trim()||"";
  const type=editingType||entry?.type||"diary";
  let content="";
  if(type==="blog"){content=document.getElementById("blogMdEditor")?.value.trim()||"";}else{content=document.getElementById("editorContent")?.innerHTML.trim()||"";}
  if(!title&&!stripHtml(content).trim()){toast("请写点内容","info");return;}
  const mood=type==="blog"?"":(document.querySelector(".mood-btn.selected")?.dataset.mood||"");
  const tags=getCurrentTags();const dateStr=entry?.date||selectedDate||todayStr();
  if(entry){entry.title=title||"无标题";entry.content=content;entry.type=type;entry.mood=mood;entry.tags=tags;entry.updatedAt=nowISO();}
  else{entries.unshift({id:"e_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),type,title:title||"无标题",content,date:dateStr,mood,tags,deleted:false,deletedAt:null,starred:false,createdAt:nowISO(),updatedAt:nowISO()});}
  sortEntries();await persistEntries();updateBadges();clearDraft();toast("已保存并加密 ✦","success");
  editingEntryId=null;selectedDate=null;editingType="diary";currentView="list";renderView();
}
function execFormat(cmd){const ed=document.getElementById("editorContent");if(!ed)return;ed.focus();switch(cmd){case"bold":document.execCommand("bold");break;case"italic":document.execCommand("italic");break;case"underline":document.execCommand("underline");break;case"h1":document.execCommand("formatBlock",false,"h1");break;case"h2":document.execCommand("formatBlock",false,"h2");break;case"h3":document.execCommand("formatBlock",false,"h3");break;case"ul":document.execCommand("insertUnorderedList");break;case"ol":document.execCommand("insertOrderedList");break;case"quote":document.execCommand("formatBlock",false,"blockquote");break;case"code":wrapSel("code");break;case"pre":wrapSel("pre");break;case"hr":document.execCommand("insertHorizontalRule");break;case"link":const url=prompt("链接：","https://");if(url)document.execCommand("createLink",false,url);break;}ed.focus();
}
function wrapSel(tag){const sel=window.getSelection();if(!sel.rangeCount)return;const r=sel.getRangeAt(0);if(r.collapsed)return;const w=document.createElement(tag);try{r.surroundContents(w);}catch(e){const f=r.extractContents();w.appendChild(f);r.insertNode(w);}sel.removeAllRanges();}

// ===== AUTO-SAVE =====
function scheduleAutoSave(){autoSaveDirty=true;updateAutoSaveIndicator();clearTimeout(autoSaveTimer);autoSaveTimer=setTimeout(()=>{saveDraft();},1500);}

// ===== ENTRY CARDS =====
function cardHTML(e,isTrash=false){
  const rawPreview=e.type==="blog"?stripHtml(renderMarkdown(e.content||"")):stripHtml(e.content||"");
  const preview=rawPreview.substring(0,180);
  const rtime=e.type==="blog"?`<span class="reading-time">📖 ${readingTime(e.content||"")}</span>`:"";
  return `<div class="entry-card${e.type==="blog"?" blog-card":""}${isTrash?" deleted-card":""}" data-id="${e.id}">
    <div class="entry-card-header">
      <span class="entry-card-title">${escapeHtml(e.title)}</span>
      <span class="entry-card-type ${e.type==="blog"?"blog-badge":"diary-badge"}">${e.type==="blog"?"BLOG":"日记"}</span>
      <span class="entry-card-date">${formatDate(e.date)}</span></div>
    <div class="entry-card-preview">${preview}${preview.length>=180?"...":""}</div>
    <div class="entry-card-meta">
      ${e.mood?`<span class="entry-card-mood">${e.mood}</span>`:""}
      <div class="entry-card-tags">${(e.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>
      ${rtime}</div>
    <div class="entry-card-actions">
      ${!isTrash?`<button class="star-toggle${e.starred?" starred":""}" data-id="${e.id}">${e.starred?"⭐":"☆"}</button>`:""}
      ${!isTrash?`<button class="btn btn-danger btn-sm card-del-btn" data-id="${e.id}">🗑</button>`:""}
      ${isTrash?`<button class="btn btn-success btn-sm card-restore-btn" data-id="${e.id}">📥 恢复</button><button class="btn btn-danger btn-sm card-perm-btn" data-id="${e.id}">💀</button>`:""}
    </div></div>`;
}
function bindCardEvents(isTrash=false){
  document.querySelectorAll(".entry-card").forEach(card=>{
    card.addEventListener("click",function(e){if(e.target.closest("button"))return;editingEntryId=this.dataset.id;const entry=entries.find(x=>x.id===editingEntryId);editingType=entry?.type||"diary";currentView="editor";renderView();});
  });
  document.querySelectorAll(".star-toggle").forEach(b=>{b.addEventListener("click",async function(e){e.stopPropagation();const id=this.dataset.id;toggleStar(id);await persistEntries();updateBadges();renderView();});});
  document.querySelectorAll(".card-del-btn").forEach(b=>{b.addEventListener("click",function(e){e.stopPropagation();const id=this.dataset.id;confirmModal("移入回收站","可在回收站恢复","🗑️","移入","btn-danger",async()=>{softDel(id);await persistEntries();updateBadges();toast("已移入","info");renderView();});});});
  document.querySelectorAll(".card-restore-btn").forEach(b=>{b.addEventListener("click",async function(e){e.stopPropagation();restore(this.dataset.id);await persistEntries();updateBadges();renderTrash();toast("已恢复","success");});});
  document.querySelectorAll(".card-perm-btn").forEach(b=>{b.addEventListener("click",function(e){e.stopPropagation();const id=this.dataset.id;confirmModal("彻底删除","永久删除","💀","确认","btn-danger-solid",async()=>{permDel(id);await persistEntries();updateBadges();renderTrash();});});});
}

// ===== TAG CLOUD =====
function renderTagCloud(tags){
  if(!tags.length)return "";
  return `<div class="tag-cloud">${tags.map(t=>`<span class="tag-item${searchTag===t?" active":""}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join("")}</div>`;
}
function getAllTags(){const tagMap=new Map();getActive().forEach(e=>{(e.tags||[]).forEach(t=>tagMap.set(t,(tagMap.get(t)||0)+1));});return [...tagMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,20).map(([t])=>t);}

// ===== STATS HTML =====
function renderStatsHTML(){
  const s=computeStats();
  return `<div class="stat-item"><span class="stat-icon">📖</span><span class="stat-num">${s.total}</span><span class="stat-label">总计</span></div>
    <div class="stat-item"><span class="stat-icon">📝</span><span class="stat-num">${s.blogs}</span><span class="stat-label">博客</span></div>
    <div class="stat-item"><span class="stat-icon">⭐</span><span class="stat-num">${s.starred}</span><span class="stat-label">星标</span></div>
    <div class="stat-item"><span class="stat-icon">🔥</span><span class="stat-num">${s.streak}</span><span class="stat-label">连续天数</span></div>
    <div class="stat-item"><span class="stat-icon">✏️</span><span class="stat-num">${s.totalWords.toLocaleString()}</span><span class="stat-label">总字数</span></div>`;

// ===== VIEW RENDERERS =====
function renderList(){const list=getActive();
  mainArea.innerHTML=`<div class="top-bar"><h2>📖 <span>全部</span></h2><div class="top-actions"><button class="btn btn-primary btn-sm" id="newDiaryBtn">✚ 新日记</button><button class="btn btn-blog btn-sm" id="newBlogBtn">📝 新博客</button></div></div>
    <div class="stats-bar">${renderStatsHTML()}</div>
    <div class="entries-list" id="listContainer">${list.length===0?`<div class="no-entries"><span class="icon">📝</span><p>还没有内容 ✦</p></div>`:renderTimelineList(list)}</div>`;
  bindCardEvents();document.getElementById("newDiaryBtn").addEventListener("click",()=>{editingEntryId=null;selectedDate=null;editingType="diary";currentView="editor";renderView();});document.getElementById("newBlogBtn").addEventListener("click",()=>{editingEntryId=null;selectedDate=null;editingType="blog";currentView="editor";renderView();});
}
function renderTimelineList(list){
  const groups=new Map();list.forEach(e=>{const month=e.date.substring(0,7);if(!groups.has(month))groups.set(month,[]);groups.get(month).push(e);});
  let html="";groups.forEach((entries,month)=>{const [y,m]=month.split("-");html+=`<div class="timeline-group"><div class="timeline-label">${y}年${parseInt(m)}月</div>${entries.map(e=>cardHTML(e)).join("")}</div>`;});
  return html;
}
function renderBlogList(){const list=getBlogs();
  mainArea.innerHTML=`<div class="top-bar"><h2>📝 <span>技术博客</span></h2><div class="top-actions"><button class="btn btn-blog btn-sm" id="newBlogBtn">✚ 新博客</button></div></div>
    <div class="entries-list" id="listContainer">${list.length===0?`<div class="no-entries"><span class="icon">📝</span><p>还没有博客文章</p></div>`:list.map(e=>cardHTML(e)).join("")}</div>`;
  bindCardEvents();document.getElementById("newBlogBtn").addEventListener("click",()=>{editingEntryId=null;selectedDate=null;editingType="blog";currentView="editor";renderView();});
}
function renderStarred(){const list=getStarred();
  mainArea.innerHTML=`<div class="top-bar"><h2>⭐ <span>星标</span></h2></div>
    <div class="entries-list" id="listContainer">${list.length===0?`<div class="no-entries"><span class="icon">⭐</span><p>还没有星标</p></div>`:list.map(e=>cardHTML(e)).join("")}</div>`;
  bindCardEvents();
}
function renderSearch(){const act=getActive();const allTags=getAllTags();
  mainArea.innerHTML=`<div class="top-bar"><h2>🔍 <span>搜索</span></h2></div>
    <div class="search-bar"><input type="text" class="search-input" id="searchInput" placeholder="搜索标题、内容、标签..." value="${escapeHtml(searchQuery)}"><button class="btn btn-primary btn-sm" id="searchBtn">搜索</button></div>
    ${allTags.length?`<div style="margin-top:.3rem">${renderTagCloud(allTags)}</div>`:""}
    <div class="entries-list" id="searchResults">${searchQuery||searchTag?searchResultsHTML(searchQuery,searchTag,act):'<div class="no-entries"><span class="icon">🔎</span><p>输入关键词或点击标签搜索</p></div>'}</div>`;
  document.getElementById("searchBtn").addEventListener("click",doSearch);document.getElementById("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch();});document.getElementById("searchInput").focus();
  document.querySelectorAll(".tag-cloud .tag-item").forEach(el=>{el.addEventListener("click",function(){searchTag=this.dataset.tag;searchQuery="";if(document.getElementById("searchInput"))document.getElementById("searchInput").value="";renderSearchResultsToContainer();});});
}
function doSearch(){searchQuery=document.getElementById("searchInput").value.trim();searchTag="";document.querySelectorAll(".tag-cloud .tag-item").forEach(x=>x.classList.remove("active"));renderSearchResultsToContainer();}
function renderSearchResultsToContainer(){const container=document.getElementById("searchResults");if(!container)return;const allTags=getAllTags();let cloudEl=document.querySelector(".tag-cloud");if(cloudEl)cloudEl.innerHTML=allTags.map(t=>`<span class="tag-item${searchTag===t?" active":""}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join("");document.querySelectorAll(".tag-cloud .tag-item").forEach(el=>{el.addEventListener("click",function(){searchTag=this.dataset.tag;searchQuery="";const si=document.getElementById("searchInput");if(si)si.value="";renderSearchResultsToContainer();});});container.innerHTML=searchResultsHTML(searchQuery,searchTag,getActive());bindCardEvents();}
function searchResultsHTML(q,tag,src){
  let results=src;
  if(tag){results=results.filter(e=>(e.tags||[]).some(t=>t===tag));}
  if(q){const lq=q.toLowerCase();results=results.filter(e=>e.title.toLowerCase().includes(lq)||stripHtml(e.content).toLowerCase().includes(lq)||(e.tags||[]).some(t=>t.toLowerCase().includes(lq))||e.date.includes(q));}
  if(!results.length)return '<div class="no-entries"><span class="icon">🌌</span><p>无匹配结果</p></div>';
  return results.map(e=>cardHTML(e)).join("");
}
function renderTrash(){const list=getTrash();
  mainArea.innerHTML=`<div class="top-bar"><h2>🗑️ <span>回收站</span></h2><div class="top-actions">${list.length>0?`<button class="btn btn-danger-solid btn-sm" id="emptyBtn">💀 清空</button>`:""}</div></div>
    ${list.length>0?`<div style="color:var(--text3);font-size:.78rem;letter-spacing:1px;margin-bottom:.3rem">共 <strong style="color:var(--red)">${list.length}</strong> 篇，超过${TRASH_DAYS}天自动清理</div>`:""}
    <div class="entries-list" id="trashList">${list.length===0?`<div class="no-entries"><span class="icon">🗑️</span><p>回收站为空</p></div>`:list.map(e=>cardHTML(e,true)).join("")}</div>`;
  bindCardEvents(true);
  document.getElementById("emptyBtn")?.addEventListener("click",()=>{confirmModal("清空回收站","永久删除所有回收站内容，不可恢复","⚠️","清空","btn-danger-solid",async()=>{permDelAll();await persistEntries();updateBadges();renderTrash();toast("已清空","info");});});
}

// ===== IMPORT/EXPORT =====
async function exportEnc(){
  const p=JSON.stringify(entries);const ed=await enc(p);ed._type="stardust_encrypted";ed._exportedAt=nowISO();
  const b=new Blob([JSON.stringify(ed,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`stardust-backup-${todayStr()}.json`;a.click();
  toast("加密备份已下载 ✦","success");
}
document.getElementById("navExport").addEventListener("click",async function(e){e.preventDefault();await exportEnc();closeSidebar();});
document.getElementById("navImport").addEventListener("click",function(e){e.preventDefault();document.getElementById("importFileInput").click();closeSidebar();});
document.getElementById("importFileInput").addEventListener("change",async function(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async function(ev){
    try{const d=JSON.parse(ev.target.result);
      if(d._type==="stardust_encrypted"||(d.v&&d.iv&&d.data)){
        const iv=b642ab(d.iv);const ct=b642ab(d.data);
        const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},aesKey,ct);
        const imp=JSON.parse(new TextDecoder().decode(pt));
        if(!Array.isArray(imp))throw new Error("格式错误");
        mergeImported(imp);
      }else if(d._type==="stardust_plain"&&Array.isArray(d.entries)){mergeImported(d.entries);}
      else throw new Error("无法识别的文件格式");
    }catch(err){toast("导入失败："+err.message,"warn");}
  };r.readAsText(f);this.value="";
});
function mergeImported(imp){const ids=new Set(entries.map(e=>e.id));let added=0;imp.forEach(item=>{if(!ids.has(item.id)){entries.push(item);ids.add(item.id);added++;}});sortEntries();persistEntries().then(()=>{updateBadges();renderView();toast(`成功导入 ${added} 篇 ✦`,"success");});}

// ===== NAV & BADGES =====
function updateActiveNav(){document.querySelectorAll(".sidebar-nav a").forEach(a=>a.classList.remove("active"));const act=document.querySelector(`.sidebar-nav a[data-view="${currentView}"]`);if(act)act.classList.add("active");updateBadges();}
function updateBadges(){const eb=document.getElementById("entryCountBadge"),tb=document.getElementById("trashCountBadge"),sb=document.getElementById("starCountBadge"),bb=document.getElementById("blogCountBadge");if(eb)eb.textContent=getActive().length;if(tb)tb.textContent=getTrash().length;if(sb)sb.textContent=getStarred().length;if(bb)bb.textContent=getBlogs().length;}
function renderView(){updateActiveNav();updateBadges();
  switch(currentView){case"editor":renderEditor();break;case"list":renderList();break;case"blog":renderBlogList();break;case"starred":renderStarred();break;case"search":renderSearch();break;case"trash":renderTrash();break;default:renderEditor();}
  renderSidebarCalendar(selectedDate||todayStr());
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();if(currentView==="editor")saveCurrent();}
  if((e.ctrlKey||e.metaKey)&&e.key==="n"){e.preventDefault();editingEntryId=null;selectedDate=null;editingType="diary";currentView="editor";renderView();}
  if((e.ctrlKey||e.metaKey)&&e.key==="f"){e.preventDefault();currentView="search";renderView();setTimeout(()=>document.getElementById("searchInput")?.focus(),100);}
  if((e.ctrlKey||e.metaKey)&&e.key==="t"){e.preventDefault();currentView="trash";renderView();}
  if((e.ctrlKey||e.metaKey)&&e.key==="b"){e.preventDefault();editingEntryId=null;selectedDate=null;editingType="blog";currentView="editor";renderView();}
  if(e.key==="Escape"){if(currentView==="editor"&&!editingEntryId){currentView="list";renderView();}}
});

// ===== LOGOUT =====
document.getElementById("logoutBtn").addEventListener("click",()=>{
  confirmModal("退出登录","退出后需要重新输入密码","👋","退出","btn-danger",()=>{clearSession();location.reload();});
});

// ===== INIT =====
async function init(){
  if(await isFirstTime()){
    document.getElementById("loginSetupHint").style.display="block";
    document.getElementById("loginConfirmField").style.display="block";
    document.getElementById("loginBtn").textContent="设置并登录";
    document.getElementById("loginBtn").addEventListener("click",async function(){
      const u=document.getElementById("loginUser").value.trim();
      const p=document.getElementById("loginPass").value;
      const pc=document.getElementById("loginPassConfirm").value;
      const err=document.getElementById("loginErr");
      if(!u||!p){err.textContent="请填写账号和密码";return;}
      if(u.length<2){err.textContent="账号至少 2 个字符";return;}
      if(p.length<4){err.textContent="密码至少 4 个字符";return;}
      if(p!==pc){err.textContent="两次密码不一致";return;}
      err.textContent="正在创建...";
      await setupAccount(u,p);
      saveSession(document.getElementById("rememberMe").checked);
      document.getElementById("loginOverlay").style.display="none";
      document.getElementById("appContainer").style.display="flex";
      initApp();
    });
  }else{
    const auth=JSON.parse(localStorage.getItem(AUTH_KEY));
    if(auth)document.getElementById("loginUser").value=auth.username||"";
    if(checkSession()){document.getElementById("loginBtn").textContent="登录";}
    document.getElementById("loginBtn").addEventListener("click",async function(){
      const p=document.getElementById("loginPass").value;
      const err=document.getElementById("loginErr");
      if(!p){err.textContent="请输入密码";return;}
      err.textContent="正在验证...";
      const ok=await verifyLogin(p);
      if(!ok){err.textContent="密码错误";return;}
      saveSession(document.getElementById("rememberMe").checked);
      document.getElementById("loginOverlay").style.display="none";
      document.getElementById("appContainer").style.display="flex";
      initApp();
    });
  }
}
async function initApp(){
  await loadEntries();autoClean();updateBadges();renderView();
  updateMotivation();setInterval(updateMotivation,3600000);
  const draft=loadDraft();if(draft){editingType=draft.type||"diary";renderEditor();toast("有未保存的草稿","info");}
}
init();
})();
</script>
