<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hy01er's Tech Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{--bg:#07071a;--surface:#0f0f28;--surface2:#171736;--border:#1e1e42;--text:#dde0f5;--text2:#8890b8;--text3:#454870;--accent:#00d4ff;--accent2:#a855f7;--accent3:#ff2d78;--accent4:#fbbf24;--accent5:#10f090;--red:#ff3d5a;--radius:14px;--radius-sm:8px;--tr:0.3s cubic-bezier(.22,1,.36,1);--font:"Inter","PingFang SC","Microsoft YaHei",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#starCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ===HEADER=== */
.header{position:fixed;top:0;left:0;right:0;z-index:50;padding:.5rem 1.8rem;background:rgba(10,10,32,.9);border-bottom:1px solid var(--border);backdrop-filter:blur(20px);display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.header-logo{font-size:1.1rem;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.header-nav{display:flex;gap:.15rem;flex-wrap:wrap}
.header-nav a{color:var(--text2);text-decoration:none;padding:.35rem .8rem;border-radius:20px;font-size:.78rem;font-weight:500;letter-spacing:.5px;transition:all var(--tr);cursor:pointer}
.header-nav a:hover,.header-nav a.active{color:#fff;background:rgba(0,212,255,.1)}
.header-actions{display:flex;gap:.4rem;align-items:center}
.btn{padding:.45rem 1rem;border-radius:50px;font-size:.78rem;letter-spacing:.5px;cursor:pointer;font-weight:600;border:none;transition:all var(--tr);font-family:var(--font);display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap;text-decoration:none}
.btn-ghost{background:transparent;border:1.5px solid rgba(255,255,255,.12);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);color:#fff;box-shadow:0 0 15px rgba(0,212,255,.15)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#07071a;box-shadow:0 4px 15px rgba(0,212,255,.2)}
.btn-primary:hover{box-shadow:0 6px 25px rgba(0,212,255,.4);transform:translateY(-1px)}
.btn-danger{background:transparent;border:1.5px solid rgba(255,61,90,.35);color:var(--red)}
.btn-danger:hover{background:rgba(255,61,90,.1)}
.btn-sm{padding:.3rem .75rem;font-size:.72rem}
.search-input-sm{background:var(--surface);border:1px solid var(--border);border-radius:50px;padding:.35rem .9rem;color:#fff;font-size:.78rem;outline:none;font-family:var(--font);width:140px;transition:all var(--tr)}
.search-input-sm:focus{border-color:var(--accent);width:180px;box-shadow:0 0 15px rgba(0,212,255,.1)}

/* ===LAYOUT=== */
.app-container{position:relative;z-index:1;display:flex;min-height:100vh;padding-top:48px}
.sidebar{width:240px;min-width:240px;background:rgba(10,10,32,.6);border-right:1px solid var(--border);padding:1.2rem .8rem;position:sticky;top:48px;height:calc(100vh - 48px);z-index:5;overflow-y:auto;transition:transform var(--tr)}
.sidebar-section{margin-bottom:1.2rem}
.sidebar-title{font-size:.68rem;font-weight:700;color:var(--text3);letter-spacing:2px;margin-bottom:.5rem;text-transform:uppercase}
.sidebar-col-list{list-style:none;display:flex;flex-direction:column;gap:.15rem}
.sidebar-col-list li a{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;border-radius:8px;color:var(--text2);text-decoration:none;font-size:.78rem;letter-spacing:.5px;transition:all var(--tr);cursor:pointer}
.sidebar-col-list li a:hover,.sidebar-col-list li a.active{color:#fff;background:rgba(0,212,255,.07)}
.sidebar-col-list .col-count{font-size:.65rem;color:var(--text3);margin-left:auto}
.tag-cloud{display:flex;gap:.3rem;flex-wrap:wrap}
.tag-item{padding:.2rem .6rem;border-radius:20px;font-size:.68rem;cursor:pointer;letter-spacing:.5px;background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.12);color:var(--text2);transition:all var(--tr);text-decoration:none}
.tag-item:hover,.tag-item.active{background:rgba(168,85,247,.2);border-color:var(--accent2);color:var(--accent2)}
.about-text{font-size:.72rem;color:var(--text3);line-height:1.7;letter-spacing:.5px}
.main-area{flex:1;padding:1.5rem 2rem;max-width:960px;margin:0 auto;width:100%}

/* ===POST CARDS=== */
.post-list{display:flex;flex-direction:column;gap:.8rem}
.post-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem 1.5rem;cursor:pointer;transition:all var(--tr);position:relative;overflow:hidden;animation:fadeUp .35s ease-out;text-decoration:none;color:inherit;display:block}
.post-card:hover{border-color:rgba(0,212,255,.3);box-shadow:0 8px 30px rgba(0,0,0,.35);transform:translateX(4px)}
.post-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:3px;opacity:0;transition:opacity var(--tr)}
.post-card:hover::before{opacity:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.post-card-title{font-size:1.15rem;font-weight:700;color:#fff;letter-spacing:.5px;margin-bottom:.35rem}
.post-card-summary{color:var(--text2);font-size:.82rem;line-height:1.65;margin-bottom:.6rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-card-meta{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;font-size:.7rem;color:var(--text3);letter-spacing:.5px}
.col-badge{display:inline-block;padding:.12rem .55rem;border-radius:20px;font-size:.62rem;font-weight:700;letter-spacing:1px}
.col-badge-default{background:rgba(168,85,247,.1);color:var(--accent2)}
.read-time{display:flex;align-items:center;gap:.2rem}

/* ===COLUMN COLORS=== */
.col-mcu{background:rgba(0,212,255,.12);color:var(--accent)}
.col-hw{background:rgba(249,115,22,.12);color:var(--accent4)}
.col-ble{background:rgba(168,85,247,.15);color:var(--accent2)}
.col-wifi{background:rgba(16,240,144,.12);color:var(--accent5)}
.col-rtos{background:rgba(255,61,90,.12);color:var(--red)}
.col-tools{background:rgba(168,85,247,.1);color:var(--text2)}

/* ===SINGLE POST=== */
.post-article{animation:fadeUp .4s ease-out}
.post-header{margin-bottom:1.5rem}
.post-header h1{font-size:2rem;font-weight:900;color:#fff;letter-spacing:1px;line-height:1.3;margin-bottom:.8rem}
.post-header .post-meta{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--text3);letter-spacing:.5px}
.post-toc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1rem 1.2rem;margin-bottom:1.5rem}
.post-toc-title{font-size:.75rem;font-weight:700;color:var(--text2);letter-spacing:2px;margin-bottom:.6rem}
.post-toc ol{padding-left:1.2rem;font-size:.8rem;line-height:2}
.post-toc ol ol{padding-left:1rem;font-size:.76rem}
.post-toc a{color:var(--accent);text-decoration:none;transition:color var(--tr)}
.post-toc a:hover{color:var(--accent2)}
.post-body{font-size:.98rem;line-height:1.9;color:var(--text)}
.post-body h1,.post-body h2,.post-body h3,.post-body h4{color:#fff;margin:1.8rem 0 .6rem}
.post-body h1{font-size:1.6rem;border-bottom:2px solid var(--border);padding-bottom:.4rem}
.post-body h2{font-size:1.3rem}
.post-body h3{font-size:1.1rem;color:var(--accent2)}
.post-body p{margin:.8rem 0}
.post-body code{background:rgba(168,85,247,.15);padding:.12rem .5rem;border-radius:4px;font-family:"JetBrains Mono","Fira Code",monospace;font-size:.88em;color:var(--accent2)}
.post-body pre{background:#1a1a2e;border:1px solid var(--border);border-radius:8px;padding:1.1rem;overflow-x:auto;margin:1rem 0}
.post-body pre code{background:none;padding:0;color:inherit}
.post-body blockquote{border-left:3px solid var(--accent2);padding-left:1rem;margin:1rem 0;color:var(--text2);font-style:italic}
.post-body ul,.post-body ol{padding-left:1.5rem;margin:.6rem 0}
.post-body a{color:var(--accent)}
.post-body img{max-width:100%;border-radius:8px}
.post-body table{width:100%;border-collapse:collapse;margin:1rem 0}
.post-body th,.post-body td{border:1px solid var(--border);padding:.5rem .8rem;text-align:left}
.post-body th{background:rgba(0,212,255,.08);color:#fff;font-weight:600}
.post-body hr{border:none;border-top:1px solid var(--border);margin:2rem 0}
.post-footer{margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem}
.post-tags{display:flex;gap:.35rem;flex-wrap:wrap}

/* ===EMPTY=== */
.empty-state{text-align:center;padding:4rem 2rem;color:var(--text3);letter-spacing:2px}
.empty-state .icon{font-size:3.5rem;display:block;margin-bottom:1rem;animation:floatIcon 3s ease-in-out infinite}
@keyframes floatIcon{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ===ADMIN DRAWER=== */
.admin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none}
.admin-overlay.show{display:block}
.admin-drawer{position:fixed;top:0;right:0;width:480px;max-width:90vw;height:100vh;z-index:201;background:var(--surface);border-left:1px solid var(--border);box-shadow:-10px 0 60px rgba(0,0,0,.5);transform:translateX(100%);transition:transform var(--tr);display:flex;flex-direction:column;overflow-y:auto}
.admin-drawer.open{transform:translateX(0)}
.admin-drawer-header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.admin-drawer-title{font-size:.9rem;font-weight:700;letter-spacing:1.5px;color:var(--accent2)}
.admin-drawer-close{width:32px;height:32px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:1rem;transition:all var(--tr);display:flex;align-items:center;justify-content:center}
.admin-drawer-close:hover{border-color:var(--red);color:var(--red)}
.admin-drawer-body{padding:1.2rem;flex:1;overflow-y:auto}
.admin-section{margin-bottom:1.2rem}
.admin-label{font-size:.7rem;font-weight:700;color:var(--text3);letter-spacing:2px;margin-bottom:.4rem;text-transform:uppercase}
.admin-input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;color:#fff;font-size:.85rem;font-family:var(--font);outline:none;transition:border var(--tr)}
.admin-input:focus{border-color:var(--accent2)}
.admin-select{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;color:#fff;font-size:.85rem;font-family:var(--font);outline:none;cursor:pointer}
.admin-select option{background:var(--surface);color:#fff}
.admin-textarea{width:100%;min-height:300px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;padding:.8rem;color:var(--text);font-size:.88rem;font-family:"JetBrains Mono","Fira Code",monospace;line-height:1.7;outline:none;resize:vertical;transition:border var(--tr)}
.admin-textarea:focus{border-color:var(--accent)}
.admin-preview{min-height:200px;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:8px;padding:1rem;line-height:1.85;font-size:.9rem;color:var(--text)}
.admin-preview h1,.admin-preview h2,.admin-preview h3{color:#fff;margin:1rem 0 .5rem}
.admin-preview h1{font-size:1.4rem}
.admin-preview h2{font-size:1.15rem}
.admin-preview pre{background:#1a1a2e;border-radius:6px;padding:.8rem;overflow-x:auto}
.admin-preview code{background:rgba(168,85,247,.15);padding:.1rem .4rem;border-radius:3px;color:var(--accent2)}
.admin-preview blockquote{border-left:3px solid var(--accent2);padding-left:.8rem;color:var(--text2)}
.md-tab-bar{display:flex;gap:.3rem;margin-bottom:.5rem}
.md-tab{padding:.25rem .7rem;border-radius:6px;font-size:.72rem;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all var(--tr);font-family:var(--font)}
.md-tab.active{background:rgba(168,85,247,.2);color:var(--accent2)}
.admin-post-list{display:flex;flex-direction:column;gap:.3rem;max-height:300px;overflow-y:auto}
.admin-post-item{display:flex;justify-content:space-between;align-items:center;padding:.5rem .7rem;border-radius:8px;background:rgba(0,0,0,.2);cursor:pointer;transition:all var(--tr);font-size:.78rem}
.admin-post-item:hover{background:rgba(0,212,255,.06)}
.admin-post-item .title{color:var(--text);flex:1}
.admin-post-item .meta{font-size:.65rem;color:var(--text3);white-space:nowrap;margin-left:.5rem}
.admin-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}

/* ===PASSWORD MODAL=== */
.pw-modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center}
.pw-modal-overlay.show{display:flex}
.pw-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;max-width:380px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.pw-modal-icon{font-size:2.5rem;margin-bottom:.6rem}
.pw-modal-title{font-size:1rem;font-weight:700;color:#fff;letter-spacing:1.5px;margin-bottom:.5rem}
.pw-modal-input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:10px;padding:.7rem 1rem;color:#fff;font-size:.95rem;font-family:var(--font);outline:none;margin:.8rem 0;text-align:center}
.pw-modal-input:focus{border-color:var(--accent2)}
.pw-modal-err{color:var(--red);font-size:.75rem;min-height:1rem;margin-bottom:.4rem}
.pw-modal-hint{font-size:.68rem;color:var(--text3);margin-top:.8rem}

/* ===TOAST=== */
.toast-container{position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.4rem}
.toast{padding:.6rem 1.2rem;border-radius:50px;font-size:.78rem;font-weight:600;letter-spacing:.5px;animation:toastIn .35s ease-out,toastOut .35s 2.3s ease-out forwards;backdrop-filter:blur(15px);border:1px solid}
.toast-success{background:rgba(16,240,144,.12);border-color:rgba(16,240,144,.35);color:var(--accent5)}
.toast-info{background:rgba(0,212,255,.12);border-color:rgba(0,212,255,.35);color:var(--accent)}
.toast-warn{background:rgba(249,115,22,.12);border-color:rgba(249,115,22,.35);color:var(--accent4)}
@keyframes toastIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-20px)}}

/* ===RESPONSIVE=== */
@media(max-width:768px){
  .sidebar{display:none}
  .main-area{padding:.8rem}
  .header{padding:.4rem 1rem}
  .header-nav{display:none}
  .search-input-sm{width:100px}.search-input-sm:focus{width:130px}
  .post-header h1{font-size:1.4rem}
  .admin-drawer{width:100vw;max-width:100vw}
}
</style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<!-- HEADER -->
<header class="header">
  <a class="header-logo" id="homeLink">✦ Hy01er's Blog</a>
  <nav class="header-nav" id="headerNav"></nav>
  <div class="header-actions">
    <input type="text" class="search-input-sm" id="searchInput" placeholder="搜索...">
    <button class="btn btn-ghost btn-sm" id="adminBtn">管理</button>
  </div>
</header>

<div class="toast-container" id="toastContainer"></div>
<div class="admin-overlay" id="adminOverlay"></div>

<!-- ADMIN DRAWER -->
<div class="admin-drawer" id="adminDrawer">
  <div class="admin-drawer-header">
    <span class="admin-drawer-title">博客管理</span>
    <button class="admin-drawer-close" id="adminCloseBtn">✕</button>
  </div>
  <div class="admin-drawer-body" id="adminBody"></div>
</div>

<!-- APP CONTAINER -->
<div class="app-container" id="appContainer">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">专栏</div>
      <ul class="sidebar-col-list" id="sidebarColList"></ul>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">标签</div>
      <div class="tag-cloud" id="sidebarTags"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">关于</div>
      <p class="about-text">嵌入式系统 · 硬件设计 · 蓝牙/WiFi · RTOS<br>记录从底层到上层的技术之路。</p>
    </div>
  </aside>
  <main class="main-area" id="mainArea"></main>
</div>

<!-- PASSWORD MODAL -->
<div class="pw-modal-overlay" id="pwModal">
  <div class="pw-modal">
    <div class="pw-modal-icon">🔐</div>
    <div class="pw-modal-title" id="pwModalTitle">管理员登录</div>
    <input type="password" class="pw-modal-input" id="pwInput" placeholder="输入管理密码" maxlength="64">
    <div class="pw-modal-err" id="pwErr"></div>
    <button class="btn btn-primary" id="pwSubmitBtn">确认</button>
    <div class="pw-modal-hint" id="pwHint"></div>
  </div>
</div>

<script>
(function(){
"use strict";

// ===== STAR CANVAS =====
const sc=document.getElementById("starCanvas"),sctx=sc.getContext("2d");
let stars=[];
function resizeSC(){sc.width=innerWidth;sc.height=innerHeight;}
function initStars(){stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*1.2+0.3,ts:Math.random()*0.015+0.003,to:Math.random()*Math.PI*2,hue:[200,270,340,40][Math.floor(Math.random()*4)]});}
function drawStars(t){sctx.clearRect(0,0,sc.width,sc.height);stars.forEach(s=>{const a=0.25+Math.sin(t*s.ts+s.to)*0.28;sctx.beginPath();sctx.arc(s.x,s.y,s.r,0,Math.PI*2);sctx.fillStyle=`hsla(${s.hue},80%,75%,${a})`;sctx.fill();});requestAnimationFrame(drawStars);}
resizeSC();initStars();requestAnimationFrame(drawStars);
window.addEventListener("resize",()=>{resizeSC();initStars();});

// ===== CONFIGURE MARKED =====
try{marked.use({breaks:true,gfm:true});}catch(e){marked.setOptions({breaks:true,gfm:true});}
function renderMarkdown(md){let html=marked.parse(md||"");try{const temp=document.createElement("div");temp.innerHTML=html;temp.querySelectorAll("pre code").forEach(block=>{try{const lang=block.className.replace("language-","")||"";if(lang&&hljs.getLanguage(lang)){const r=hljs.highlight(block.textContent,{language:lang});block.innerHTML=r.value;block.className+=" hljs";}else{hljs.highlightElement(block);}}catch(e){}});html=temp.innerHTML;}catch(e){}return html;}

// ===== BLOG DATA =====
let blogData={settings:{blogName:"Hy01er's Tech Blog",blogDesc:"嵌入式系统 · 硬件 · 蓝牙/WiFi · RTOS",adminPasswordHash:"",passwordSalt:"",adminSetup:true},columns:[{id:"mcu",name:"MCU & ARM",icon:"💻"},{id:"hw",name:"硬件设计",icon:"🔧"},{id:"ble",name:"蓝牙 BLE",icon:"📶"},{id:"wifi",name:"WiFi & 网络",icon:"🌐"},{id:"rtos",name:"RTOS",icon:"⏱️"},{id:"tools",name:"工具链",icon:"🛠️"}],posts:[]};
let isAdmin=false,editingPostId=null;

function loadBlogData(){
  const el=document.getElementById("blogData");
  if(el){try{const d=JSON.parse(el.textContent);if(d.settings)blogData.settings=d.settings;if(d.columns)blogData.columns=d.columns;if(d.posts)blogData.posts=d.posts;}catch(e){}}
  blogData.posts.sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt));
}
function saveBlogData(){document.getElementById("blogData").textContent=JSON.stringify(blogData,null,2);}

// ===== UI UTILS =====
function toast(msg,ty="info"){const c=document.getElementById("toastContainer");const t=document.createElement("div");t.className=`toast toast-${ty}`;t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),2800);}
function escapeHtml(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function stripHtml(h){const d=document.createElement("div");d.innerHTML=h;return d.textContent||"";}
function wordCount(md){const text=stripHtml(renderMarkdown(md));const cn=text.replace(/[a-zA-Z0-9\s]/g,"");const en=text.replace(/[^\sa-zA-Z0-9]/g,"").split(/\s+/).filter(Boolean);return cn.length+en.length;}
function readingTime(md){return Math.max(1,Math.ceil(wordCount(md)/300));}
function formatDate(ds){if(!ds)return"";const d=new Date(ds);return `${d.getFullYear()}年${String(d.getMonth()+1).padStart(2,"0")}月${String(d.getDate()).padStart(2,"0")}日`;}
function formatDateShort(ds){if(!ds)return"";const d=new Date(ds);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function slugify(s){return s.toLowerCase().replace(/\s+/g,"-").replace(/[^\w一-鿿-]/g,"").replace(/-+/g,"-").replace(/^-|-$/g,"").substring(0,80)||"post";}
function getColumn(colId){return blogData.columns.find(c=>c.id===colId);}
function getAllTags(){const m=new Map();blogData.posts.forEach(p=>{(p.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1));});return [...m.entries()].sort((a,b)=>b[1]-a[1]);}
function colColorClass(colId){const map={mcu:"col-mcu",hw:"col-hw",ble:"col-ble",wifi:"col-wifi",rtos:"col-rtos",tools:"col-tools"};return map[colId]||"col-badge-default";}

// ===== AUTH =====
async function sha256(msg){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg));return btoa(String.fromCharCode(...new Uint8Array(buf)));}
async function hashPassword(pw,salt){return sha256(pw+salt);}
function generateSalt(){return btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));}
async function checkAdminPassword(pw){
  if(!blogData.settings.passwordSalt||blogData.settings.adminSetup){
    blogData.settings.passwordSalt=generateSalt();
    blogData.settings.adminPasswordHash=await hashPassword(pw,blogData.settings.passwordSalt);
    blogData.settings.adminSetup=false;
    saveBlogData();
    return true;
  }
  const h=await hashPassword(pw,blogData.settings.passwordSalt);
  return h===blogData.settings.adminPasswordHash;
}

// ===== ROUTING =====
function getRoute(){const h=location.hash.slice(1)||"";const [action,id]=h.split("/");return{action:action||"home",id:id||""};}
function navigate(action,id){location.hash=id?`#${action}/${id}`:`#${action}`;}

// ===== NAVIGATION =====
function renderHeaderNav(){
  const nav=document.getElementById("headerNav");
  nav.innerHTML=blogData.columns.map(c=>`<a data-col="${c.id}" href="#column/${c.id}">${c.icon} ${c.name}</a>`).join("");
  document.getElementById("homeLink").addEventListener("click",e=>{e.preventDefault();navigate("home");});
}
function updateActiveNav(){
  document.querySelectorAll(".header-nav a").forEach(a=>a.classList.remove("active"));
  const r=getRoute();
  if(r.action==="column"){const a=document.querySelector(`.header-nav a[data-col="${r.id}"]`);if(a)a.classList.add("active");}
}

// ===== SIDEBAR =====
function renderSidebar(){
  const colList=document.getElementById("sidebarColList");
  colList.innerHTML=blogData.columns.map(c=>{const count=blogData.posts.filter(p=>p.column===c.id).length;return`<li><a href="#column/${c.id}" data-col="${c.id}">${c.icon} ${c.name}<span class="col-count">${count}</span></a>`;}).join("");
  const tags=getAllTags();
  document.getElementById("sidebarTags").innerHTML=tags.slice(0,15).map(([t])=>`<a href="#tag/${encodeURIComponent(t)}" class="tag-item">${escapeHtml(t)}</a>`).join("");
  const r=getRoute();
  document.querySelectorAll(".sidebar-col-list a").forEach(a=>{a.classList.remove("active");if(a.dataset.col===r.id)a.classList.add("active");});
}

// ===== PUBLIC VIEWS =====
function renderView(){
  updateActiveNav();renderSidebar();
  const r=getRoute();
  switch(r.action){
    case"home":renderHome();break;
    case"column":renderColumn(r.id);break;
    case"post":renderPost(r.id);break;
    case"tag":renderTag(decodeURIComponent(r.id));break;
    case"search":renderSearch();break;
    default:renderHome();
  }
  if(isAdmin&&document.getElementById("adminDrawer").classList.contains("open"))renderAdminPanel();
}

function renderHome(){
  const posts=blogData.posts.slice(0,20);
  document.getElementById("mainArea").innerHTML=`
    <div style="margin-bottom:1.5rem"><h2 style="font-size:1.4rem;font-weight:700;color:#fff;letter-spacing:1px">最新文章</h2></div>
    ${posts.length?`<div class="post-list">${posts.map(postCardHTML).join("")}</div>`:`<div class="empty-state"><span class="icon">📝</span><p>还没有文章，管理员登录后开始写作</p></div>`}`;
  bindPostCardClicks();
}

function renderColumn(colId){
  const col=getColumn(colId);
  if(!col){renderHome();return;}
  const posts=blogData.posts.filter(p=>p.column===colId);
  document.getElementById("mainArea").innerHTML=`
    <div style="margin-bottom:1.5rem"><h2 style="font-size:1.4rem;font-weight:700;color:#fff;letter-spacing:1px">${col.icon} ${col.name}<span style="font-size:.8rem;color:var(--text3);margin-left:.5rem">${posts.length} 篇</span></h2></div>
    ${posts.length?`<div class="post-list">${posts.map(postCardHTML).join("")}</div>`:`<div class="empty-state"><span class="icon">${col.icon}</span><p>专栏暂无文章</p></div>`}`;
  bindPostCardClicks();
}

function renderPost(slug){
  const post=blogData.posts.find(p=>p.slug===slug||p.id===slug);
  if(!post){document.getElementById("mainArea").innerHTML=`<div class="empty-state"><span class="icon">🌌</span><p>文章不存在</p></div>`;return;}
  const col=getColumn(post.column);const body=renderMarkdown(post.content);
  const toc=generateTOC(body);
  document.title=`${post.title} - Hy01er's Blog`;
  document.getElementById("mainArea").innerHTML=`
    <article class="post-article">
      <div class="post-header">
        <h1>${escapeHtml(post.title)}</h1>
        <div class="post-meta">
          ${col?`<span class="col-badge ${colColorClass(col.id)}">${col.icon} ${col.name}</span>`:""}
          <span>${formatDate(post.publishedAt)}</span>
          <span>${readingTime(post.content)} 分钟阅读</span>
        </div>
      </div>
      ${toc?`<div class="post-toc"><div class="post-toc-title">目录</div>${toc}</div>`:""}
      <div class="post-body">${body}</div>
      <div class="post-footer">
        <div class="post-tags">${(post.tags||[]).map(t=>`<a href="#tag/${encodeURIComponent(t)}" class="tag-item">${escapeHtml(t)}</a>`).join("")}</div>
        <a href="javascript:history.back()" class="btn btn-ghost btn-sm">← 返回</a>
      </div>
    </article>`;
}

function renderTag(tag){
  const posts=blogData.posts.filter(p=>(p.tags||[]).includes(tag));
  document.getElementById("mainArea").innerHTML=`
    <div style="margin-bottom:1.5rem"><h2 style="font-size:1.4rem;font-weight:700;color:#fff;letter-spacing:1px">🏷 ${escapeHtml(tag)}<span style="font-size:.8rem;color:var(--text3);margin-left:.5rem">${posts.length} 篇</span></h2></div>
    ${posts.length?`<div class="post-list">${posts.map(postCardHTML).join("")}</div>`:`<div class="empty-state"><span class="icon">🏷</span><p>没有相关文章</p></div>`}`;
  bindPostCardClicks();
}

function renderSearch(){
  const q=new URLSearchParams(location.search).get("q")||"";
  document.getElementById("mainArea").innerHTML=`
    <div style="margin-bottom:1.5rem"><h2 style="font-size:1.4rem;font-weight:700;color:#fff;letter-spacing:1px">搜索</h2>
    <div style="display:flex;gap:.5rem;margin-top:.8rem"><input type="text" class="admin-input" id="searchPageInput" placeholder="按标题、标签、内容搜索..." value="${escapeHtml(q)}" style="max-width:400px"><button class="btn btn-primary btn-sm" id="searchPageBtn">搜索</button></div></div>
    <div id="searchResults">${q?searchResultsHTML(q):'<div class="empty-state"><span class="icon">🔎</span><p>输入关键词搜索</p></div>'}</div>`;
  document.getElementById("searchPageBtn").addEventListener("click",()=>{const v=document.getElementById("searchPageInput").value.trim();history.replaceState(null,"","?q="+encodeURIComponent(v));document.getElementById("searchResults").innerHTML=searchResultsHTML(v);bindPostCardClicks();});
  document.getElementById("searchPageInput").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("searchPageBtn").click();});
}

function searchResultsHTML(q){
  const lq=q.toLowerCase();const results=blogData.posts.filter(p=>p.title.toLowerCase().includes(lq)||stripHtml(renderMarkdown(p.content||"")).toLowerCase().includes(lq)||(p.tags||[]).some(t=>t.toLowerCase().includes(lq)));
  if(!results.length)return '<div class="empty-state"><span class="icon">🌌</span><p>无匹配结果</p></div>';
  return `<div class="post-list">${results.map(postCardHTML).join("")}</div>`;
}

// ===== POST CARDS =====
function postCardHTML(p){
  const col=getColumn(p.column);
  return `<a class="post-card" href="#post/${p.slug||p.id}">
    <div class="post-card-title">${escapeHtml(p.title)}</div>
    <div class="post-card-summary">${p.summary||stripHtml(renderMarkdown(p.content||"")).substring(0,150)}</div>
    <div class="post-card-meta">
      ${col?`<span class="col-badge ${colColorClass(col.id)}">${col.icon} ${col.name}</span>`:""}
      <span>${formatDate(p.publishedAt)}</span>
      <span class="read-time">${readingTime(p.content||"")} 分钟阅读</span>
    </div>
  </a>`;
}
function bindPostCardClicks(){
  document.querySelectorAll(".post-card").forEach(card=>{
    card.addEventListener("click",function(e){e.preventDefault();location.hash=this.getAttribute("href").replace("#","");});
  });
}

// ===== TOC =====
function generateTOC(html){
  const temp=document.createElement("div");temp.innerHTML=html;
  const headings=temp.querySelectorAll("h1,h2,h3");
  if(headings.length<2)return"";
  let toc='<ol>',stack=[1];
  headings.forEach(h=>{const lv=parseInt(h.tagName[1]);const text=h.textContent.trim();const id=slugify(text);
    while(stack[stack.length-1]<lv){toc+='<ol>';stack.push(lv);}
    while(stack[stack.length-1]>lv){toc+='</ol>';stack.pop();}
    toc+=`<li><a href="#${id}">${escapeHtml(text)}</a></li>`;});
  while(stack.length>1){toc+='</ol>';stack.pop();}
  toc+='</ol>';return toc;
}

function showPasswordModal(){
  const m=document.getElementById("pwModal");m.classList.add("show");
  document.getElementById("pwInput").value="";document.getElementById("pwErr").textContent="";
  if(blogData.settings.adminSetup){document.getElementById("pwModalTitle").textContent="首次设置管理密码";document.getElementById("pwHint").textContent="请设置密码以管理博客";}
  else{document.getElementById("pwModalTitle").textContent="管理员登录";document.getElementById("pwHint").textContent="";}
  document.getElementById("pwInput").focus();
}
function hidePasswordModal(){document.getElementById("pwModal").classList.remove("show");}

document.getElementById("pwSubmitBtn").addEventListener("click",async()=>{
  const pw=document.getElementById("pwInput").value;
  if(!pw){document.getElementById("pwErr").textContent="请输入密码";return;}
  const ok=await checkAdminPassword(pw);
  if(!ok){document.getElementById("pwErr").textContent="密码错误";return;}
  isAdmin=true;hidePasswordModal();
  if(blogData.settings.adminSetup){saveBlogData();toast("管理密码已设置","success");}
  else{toast("管理模式","info");}
  openDrawer();
});
document.getElementById("pwInput").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("pwSubmitBtn").click();});
document.getElementById("pwModal").addEventListener("click",function(e){if(e.target===this)hidePasswordModal();});

function openDrawer(){
  document.getElementById("adminDrawer").classList.add("open");
  document.getElementById("adminOverlay").classList.add("show");
  renderAdminPanel();
}
function closeDrawer(){
  document.getElementById("adminDrawer").classList.remove("open");
  document.getElementById("adminOverlay").classList.remove("show");
}
document.getElementById("adminCloseBtn").addEventListener("click",closeDrawer);
document.getElementById("adminOverlay").addEventListener("click",closeDrawer);
document.getElementById("adminBtn").addEventListener("click",showAdminPanel);

  }else{
    body.innerHTML=`
      <div class="admin-section">
        <div class="admin-actions">
          <button class="btn btn-primary btn-sm" id="adminNewPostBtn">✚ 新建文章</button>
          <button class="btn btn-ghost btn-sm" id="adminPublishBtn">📤 发布到 GitHub</button>
          <button class="btn btn-danger btn-sm" id="adminLogoutBtn">退出</button>
        </div>
      </div>
      <div class="admin-section">
        <div class="admin-label">所有文章 (${blogData.posts.length})</div>
        <div class="admin-post-list">${blogData.posts.length?blogData.posts.map(p=>`<div class="admin-post-item" data-id="${p.id}"><span class="title">${escapeHtml(p.title)}</span><span class="meta">${formatDateShort(p.publishedAt)}</span></div>`).join(""):'<div style="color:var(--text3);font-size:.75rem;padding:.5rem">暂无文章</div>'}</div>
      </div>
      <div class="admin-section">
        <div class="admin-label">专栏管理</div>
        <div id="adminColList">${blogData.columns.map(c=>`<div style="display:flex;gap:.4rem;align-items:center;margin-bottom:.3rem"><input type="text" class="admin-input" value="${escapeHtml(c.icon)} ${escapeHtml(c.name)}" data-col-id="${c.id}" style="flex:1"><button class="btn btn-danger btn-sm" data-col-del="${c.id}">✕</button></div>`).join("")}</div>
        <div style="display:flex;gap:.4rem;margin-top:.4rem"><input type="text" class="admin-input" id="newColName" placeholder="新专栏名称" style="flex:1"><input type="text" class="admin-input" id="newColIcon" placeholder="图标" style="width:60px" maxlength="4" value="📌"><button class="btn btn-ghost btn-sm" id="addColBtn">+</button></div>
      </div>`;
    body.querySelectorAll(".admin-post-item").forEach(el=>{el.addEventListener("click",function(){editingPostId=this.dataset.id;renderAdminPanel();});});
    document.getElementById("adminNewPostBtn").addEventListener("click",()=>{editingPostId="new";renderAdminPanel();});
    document.getElementById("adminPublishBtn").addEventListener("click",publishBlog);
    document.getElementById("adminLogoutBtn").addEventListener("click",()=>{isAdmin=false;editingPostId=null;closeDrawer();toast("已退出管理","info");});
    document.getElementById("addColBtn").addEventListener("click",()=>{const n=document.getElementById("newColName").value.trim();const ic=document.getElementById("newColIcon").value.trim()||"📌";if(n){blogData.columns.push({id:slugify(n),name:n,icon:ic});saveBlogData();renderAdminPanel();renderView();}});
    body.querySelectorAll("[data-col-del]").forEach(b=>{b.addEventListener("click",function(){const id=this.dataset.colDel;blogData.columns=blogData.columns.filter(c=>c.id!==id);saveBlogData();renderAdminPanel();renderView();});});
    body.querySelectorAll("[data-col-id]").forEach(inp=>{inp.addEventListener("change",function(){const id=this.dataset.colId;const col=blogData.columns.find(c=>c.id===id);if(col){const m=this.value.match(/^(\S+)\s+(.+)/);if(m){col.icon=m[1];col.name=m[2];}else{col.name=this.value;}saveBlogData();renderView();}});});
  }
}

function renderAdminEditor(post){
  const isNew=!post;
  const p=isNew?{id:"",title:"",slug:"",column:blogData.columns[0]?.id||"",tags:[],content:"",summary:"",publishedAt:new Date().toISOString().slice(0,10)}:post;
  const body=document.getElementById("adminBody");
  body.innerHTML=`
    <div class="admin-section"><button class="btn btn-ghost btn-sm" id="adminBackBtn">← 返回列表</button></div>
    <div class="admin-section"><div class="admin-label">标题</div><input type="text" class="admin-input" id="adminTitle" value="${escapeHtml(p.title)}" placeholder="文章标题"></div>
    <div class="admin-section"><div class="admin-label">专栏</div><select class="admin-select" id="adminColumn">${blogData.columns.map(c=>`<option value="${c.id}" ${p.column===c.id?"selected":""}>${c.icon} ${c.name}</option>`).join("")}</select></div>
    <div class="admin-section"><div class="admin-label">标签 (逗号分隔)</div><input type="text" class="admin-input" id="adminTags" value="${(p.tags||[]).join(",")}" placeholder="React,JavaScript,前端"></div>
    <div class="admin-section"><div class="admin-label">摘要 (留空自动截取)</div><input type="text" class="admin-input" id="adminSummary" value="${escapeHtml(p.summary||"")}" placeholder="简短描述"></div>
    <div class="admin-section"><div class="admin-label">日期</div><input type="date" class="admin-input" id="adminDate" value="${p.publishedAt?p.publishedAt.slice(0,10):""}"></div>
    <div class="admin-section">
      <div class="md-tab-bar"><button class="md-tab active" data-tab="write">✍️ 编写</button><button class="md-tab" data-tab="preview">👁️ 预览</button></div>
      <textarea class="admin-textarea" id="adminContent" placeholder="Markdown 内容...">${escapeHtml(p.content||"")}</textarea>
      <div class="admin-preview" id="adminPreview" style="display:none"></div>
    </div>
    <div class="admin-actions">
      <button class="btn btn-primary btn-sm" id="adminSaveBtn">💾 保存</button>
      ${!isNew?`<button class="btn btn-danger btn-sm" id="adminDeleteBtn">🗑 删除</button>`:""}
    </div>`;
  document.getElementById("adminBackBtn").addEventListener("click",()=>{editingPostId=null;renderAdminPanel();});
  document.querySelectorAll(".md-tab").forEach(tab=>{tab.addEventListener("click",function(){const t=this.dataset.tab;document.querySelectorAll(".md-tab").forEach(x=>x.classList.remove("active"));this.classList.add("active");document.getElementById("adminContent").style.display=t==="write"?"block":"none";document.getElementById("adminPreview").style.display=t==="preview"?"block":"none";if(t==="preview"){document.getElementById("adminPreview").innerHTML=renderMarkdown(document.getElementById("adminContent").value);}});});
  document.getElementById("adminSaveBtn").addEventListener("click",()=>savePost(isNew,p));
  if(!isNew){document.getElementById("adminDeleteBtn").addEventListener("click",()=>{if(confirm("确定删除《"+p.title+"》？")){blogData.posts=blogData.posts.filter(x=>x.id!==p.id);saveBlogData();editingPostId=null;renderAdminPanel();renderView();toast("已删除","info");}});}
}

function savePost(isNew,oldPost){
  const title=document.getElementById("adminTitle").value.trim();
  const content=document.getElementById("adminContent").value.trim();
  if(!title){toast("请输入标题","warn");return;}
  if(!content){toast("请输入内容","warn");return;}
  const column=document.getElementById("adminColumn").value;
  const tags=document.getElementById("adminTags").value.split(",").map(t=>t.trim()).filter(Boolean);
  const summary=document.getElementById("adminSummary").value.trim()||stripHtml(renderMarkdown(content)).substring(0,150);
  const dateVal=document.getElementById("adminDate").value;
  const pubDate=dateVal?new Date(dateVal+"T00:00:00Z").toISOString():new Date().toISOString();
  const slug=slugify(title);
  if(isNew){
    blogData.posts.unshift({id:"p_"+Date.now(),title,slug,column,tags,content,summary,publishedAt:pubDate,updatedAt:new Date().toISOString()});
  }else{
    const post=blogData.posts.find(p=>p.id===editingPostId);
    if(post){post.title=title;post.slug=slug;post.column=column;post.tags=tags;post.content=content;post.summary=summary;post.publishedAt=pubDate;post.updatedAt=new Date().toISOString();}
  }
  blogData.posts.sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt));
  saveBlogData();editingPostId=null;renderAdminPanel();renderView();
  toast("已保存","success");
}

// ===== PUBLISH =====
function publishBlog(){
  saveBlogData();
  const html=document.documentElement.outerHTML;
  const blob=new Blob(["<!DOCTYPE html>\n"+html],{type:"text/html"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="index.html";a.click();
  toast("已下载 index.html → 请 git commit & push","success");
}
